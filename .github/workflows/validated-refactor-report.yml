name: Validated refactor report

on:
  pull_request:
    branches:
      - agent/fix-full-source-review

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format, validate, analyze, and test
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p build/refactor-validation
          : > build/refactor-validation/status.txt

          dart format lib test integration_test tool \
            > build/refactor-validation/format.log 2>&1
          format_status=$?
          echo "format=$format_status" >> build/refactor-validation/status.txt

          dart run tool/generate_content_bundle.dart --check \
            > build/refactor-validation/bundle.log 2>&1
          bundle_status=$?
          echo "bundle=$bundle_status" >> build/refactor-validation/status.txt

          dart run tool/validate_runtime_content.dart \
            > build/refactor-validation/runtime.log 2>&1
          runtime_status=$?
          echo "runtime=$runtime_status" >> build/refactor-validation/status.txt

          flutter analyze \
            > build/refactor-validation/analyze.log 2>&1
          analyze_status=$?
          echo "analyze=$analyze_status" >> build/refactor-validation/status.txt

          flutter test -r expanded \
            > build/refactor-validation/test.log 2>&1
          test_status=$?
          echo "test=$test_status" >> build/refactor-validation/status.txt

          overall=0
          for status in \
            "$format_status" \
            "$bundle_status" \
            "$runtime_status" \
            "$analyze_status" \
            "$test_status"; do
            if [ "$status" -ne 0 ]; then
              overall=1
            fi
          done

          {
            echo "# Refactor validation"
            echo
            cat build/refactor-validation/status.txt
            for name in bundle runtime analyze test; do
              status_var="${name}_status"
              status="${!status_var}"
              if [ "$status" -ne 0 ]; then
                echo
                echo "## $name failure tail"
                echo '```'
                tail -n 160 "build/refactor-validation/$name.log"
                echo '```'
              fi
            done
          } > .github/refactor-validation-report.md

          echo "overall=$overall" >> "$GITHUB_OUTPUT"

      - name: Commit formatting and validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test tool assets/data/content_bundle.json assets/data/content_manifest.json .github/refactor-validation-report.md
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "Format and record refactor validation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Fail when validation failed
        if: steps.validation.outputs.overall != '0'
        run: exit 1
