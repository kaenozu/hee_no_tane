name: Fix Daily Progress Refactor Workflow

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/daily-progress-service
          fetch-depth: 0

      - name: Patch workflow
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-daily-progress-refactor.yml')
          text = path.read_text()

          old_retry = """              expect(service.calls, 1);\n              expect(find.text('保存エラー'), findsOneWidget);\n\n              await tester.tap(find.text('再試行'));"""
          new_retry = """              expect(service.calls, 1);\n              expect(find.text('保存エラー'), findsOneWidget);\n\n              await tester.ensureVisible(find.text('再試行'));\n              await tester.tap(find.text('再試行'));"""
          if text.count(old_retry) != 1:
              raise SystemExit('retry test snippet not found exactly once')
          text = text.replace(old_retry, new_retry, 1)

          old_commit = """          rm .github/workflows/apply-daily-progress-refactor.yml\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add lib/features/question/daily_question_screen.dart \\\n            lib/features/home/home_screen.dart \\\n            lib/application/daily_progress_service.dart \\\n            test/features/daily_question_progress_service_test.dart \\\n            .github/workflows/apply-daily-progress-refactor.yml"""
          new_commit = """          rm -f .github/workflows/apply-daily-progress-refactor.yml \\\n            .github/workflows/diagnose-daily-progress-refactor.yml \\\n            .github/workflows/capture-daily-progress-test-output.yml \\\n            .github/daily-progress-delegation-report.txt\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add -A .github \\\n            lib/features/question/daily_question_screen.dart \\\n            lib/features/home/home_screen.dart \\\n            lib/application/daily_progress_service.dart \\\n            test/features/daily_question_progress_service_test.dart"""
          if text.count(old_commit) != 1:
              raise SystemExit('commit cleanup snippet not found exactly once')
          path.write_text(text.replace(old_commit, new_commit, 1))
          PY

          rm .github/workflows/fix-daily-progress-refactor-workflow.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apply-daily-progress-refactor.yml \
            .github/workflows/fix-daily-progress-refactor-workflow.yml
          git commit -m "Fix daily progress retry test setup"
          git push origin HEAD:feature/daily-progress-service
