name: Regenerate issue24 runtime manifest

on:
  push:
    branches:
      - agent/24-runtime-manifest-contract
    paths:
      - '.github/workflows/regenerate-issue24-runtime-manifest.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/24-runtime-manifest-contract
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format tool/generate_content_bundle.dart
      - run: dart run tool/generate_content_bundle.dart
      - name: Commit generated contract and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tool/generate_content_bundle.dart assets/data/content_bundle.json assets/data/content_manifest.json
          git rm .github/workflows/regenerate-issue24-runtime-manifest.yml
          git commit -m 'fix: sync generated manifest to 47-pair runtime'
          git push origin HEAD:agent/24-runtime-manifest-contract
