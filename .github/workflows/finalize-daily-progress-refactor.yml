name: Finalize Daily Progress Refactor

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/daily-progress-service
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Apply refactor and fix retry test
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-daily-progress-refactor.yml')
          lines = workflow.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          )
          namespace = {'__name__': '__main__'}
          exec(compile(script, '/tmp/apply_refactor.py', 'exec'), namespace)

          test_path = Path('test/features/daily_question_progress_service_test.dart')
          text = test_path.read_text()
          old = "              await tester.tap(find.text('再試行'));"
          new = "              await tester.ensureVisible(find.text('再試行'));\n              await tester.tap(find.text('再試行'));"
          if text.count(old) != 1:
              raise SystemExit(f'expected one retry tap, found {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: dart format lib/features/question/daily_question_screen.dart lib/features/home/home_screen.dart lib/application/daily_progress_service.dart test/features/daily_question_progress_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: >-
          flutter test
          test/application/daily_progress_service_test.dart
          test/features/daily_question_screen_test.dart
          test/features/daily_question_recovery_test.dart
          test/features/daily_question_progress_service_test.dart

      - name: Commit validated changes
        run: |
          rm -f .github/workflows/apply-daily-progress-refactor.yml \
            .github/workflows/diagnose-daily-progress-refactor.yml \
            .github/workflows/capture-daily-progress-test-output.yml \
            .github/workflows/fix-daily-progress-refactor-workflow.yml \
            .github/workflows/repair-daily-progress-refactor.yml \
            .github/workflows/finalize-daily-progress-refactor.yml \
            .github/daily-progress-delegation-report.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github \
            lib/features/question/daily_question_screen.dart \
            lib/features/home/home_screen.dart \
            lib/application/daily_progress_service.dart \
            test/features/daily_question_progress_service_test.dart
          git commit -m "Use DailyProgressService for daily answers"
          git push origin HEAD:feature/daily-progress-service
