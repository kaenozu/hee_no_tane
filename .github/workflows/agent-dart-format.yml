name: Agent Dart Format

on:
  push:
    branches:
      - agent/flutter-price-comparison

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/flutter-price-comparison

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/data/repositories/comparison_repository.dart \
            lib/domain/price_comparison/comparison_engine.dart \
            lib/domain/price_comparison/input_validator.dart \
            lib/domain/price_comparison/models.dart \
            lib/domain/price_comparison/pricing_calculator.dart \
            lib/features/comparison/comparison_input_screen.dart \
            lib/features/comparison/comparison_result_screen.dart \
            lib/features/comparison/offer_input_card.dart \
            lib/features/home/daily_assignment_gate.dart \
            test/data/repositories/comparison_repository_test.dart \
            test/domain/price_comparison/comparison_engine_test.dart \
            test/domain/price_comparison/input_validator_test.dart \
            test/domain/price_comparison/pricing_calculator_test.dart \
            test/features/comparison/comparison_input_screen_test.dart \
            test/features/comparison/comparison_result_screen_test.dart

      - name: Remove temporary workflow
        run: git rm .github/workflows/agent-dart-format.yml

      - name: Commit formatted files
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format price comparison Dart files"
          git push origin HEAD:agent/flutter-price-comparison
