name: Format price comparison branch

on:
  push:
    branches:
      - agent/price-comparison-feature
    paths:
      - .github/workflows/format-price-comparison-branch.yml
      - lib/domain/models/hee_card.dart
      - lib/domain/models/question.dart
      - lib/domain/models/source_metadata.dart
      - lib/domain/services/price_calculator.dart
      - lib/features/comparison/price_comparison_screen.dart
      - lib/features/settings/settings_screen.dart
      - test/domain/models/source_metadata_test.dart
      - test/features/daily_question_update_idempotency_test.dart

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/price-comparison-feature

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: >-
          dart format
          lib/domain/models/hee_card.dart
          lib/domain/models/question.dart
          lib/domain/models/source_metadata.dart
          lib/domain/services/price_calculator.dart
          lib/features/comparison/price_comparison_screen.dart
          lib/features/settings/settings_screen.dart
          test/domain/models/source_metadata_test.dart
          test/features/daily_question_update_idempotency_test.dart

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: format price comparison and CI fixes"
          git push origin HEAD:agent/price-comparison-feature
