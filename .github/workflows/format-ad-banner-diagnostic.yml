name: Format ad banner diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Show exact formatter output
        shell: bash
        run: |
          dart format lib/monetization/ad_banner.dart
          echo '--- FORMAT DIFF START ---'
          git diff -- lib/monetization/ad_banner.dart
          echo '--- FORMAT DIFF END ---'
