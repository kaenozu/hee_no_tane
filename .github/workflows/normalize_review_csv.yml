name: Normalize review CSV

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approval branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-approval-batch-1
          fetch-depth: 0

      - name: Normalize CSV line endings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('review/content_review_batch_1.csv')
          data = path.read_bytes().replace(b'\r\n', b'\n')
          path.write_bytes(data)
          PY

      - name: Commit normalized CSV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review/content_review_batch_1.csv
          if git diff --cached --quiet; then
            echo "CSV already uses LF line endings."
            exit 0
          fi
          git commit -m "Normalize content review CSV line endings"
          git push origin HEAD:agent/content-approval-batch-1
