name: Temporary format price parity

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/domain/models/price_comparison.dart \
            lib/domain/price_comparison \
            lib/domain/services/price_calculator.dart \
            lib/features/comparison/price_comparison_screen.dart \
            test/domain/price_comparison \
            test/features/comparison/price_comparison_screen_test.dart
          git rm .github/workflows/temporary-format-price-parity.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format price comparison parity changes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
