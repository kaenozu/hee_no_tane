name: Apply content approval batch 1

on:
  push:
    branches:
      - agent/content-approval-batch-1
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approval branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-approval-batch-1
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate review CSV and apply verified rows
        shell: bash
        run: |
          dart run tool/content_review.dart export \
            --output review/content_review_batch_1.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('review/content_review_batch_1.csv')
          updates = {
              'q_geo_005': {
                  'sourceTitle': '日本の川 - 北陸 - 信濃川',
                  'sourcePublisher': '国土交通省 水管理・国土保全局',
                  'sourceUrl': 'https://www.mlit.go.jp/river/toukei_chousa/kasen/jiten/nihon_kawa/0405_shinano/0405_shinano_00.html',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': '国土交通省の河川概要で、信濃川水系の幹川流路延長367km、日本最長、長野県内の千曲川から県境で信濃川へ名称が変わることを確認。',
              },
              'q_nature_geography_008': {
                  'sourceTitle': '日本水準原点',
                  'sourcePublisher': '国土地理院',
                  'sourceUrl': 'https://www.gsi.go.jp/sokuchikijun/suijun-genten.html',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': '国土地理院の解説で、測量法上の標高0mが東京湾平均海面で、日本水準原点が実質的な標高原点として使われることを確認。',
              },
              'q_science_006': {
                  'sourceTitle': '雷とは？',
                  'sourcePublisher': '気象庁',
                  'sourceUrl': 'https://www.jma.go.jp/jma/kishou/know/toppuu/thunder1-0.html',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': '気象庁の解説で、雷が大気中の電荷分離に伴う放電現象で、音が雷鳴、光が電光であることを確認。',
              },
              'q_nature_geography_014': {
                  'sourceTitle': '氷、霜、霧、雷、日照時間',
                  'sourcePublisher': '気象庁',
                  'sourceUrl': 'https://www.jma.go.jp/jma/kishou/know/yougo_hp/kori.html',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': '気象庁の予報用語で、霧は視程1km未満、もやは視程1km以上10km未満であることを確認。',
              },
              'q_history_012': {
                  'sourceTitle': '富岡製糸場を知る',
                  'sourcePublisher': '富岡市観光協会',
                  'sourceUrl': 'https://www.tomioka-silk.jp/_tomioka-silk-mill/about/',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': '富岡製糸場公式サイトで、1872年に主要建造物が完成して操業開始し、本格的な器械製糸が始まったことと世界遺産登録を確認。',
              },
              'q_history_013': {
                  'sourceTitle': 'Member State: Japan',
                  'sourcePublisher': 'International Bureau of Weights and Measures (BIPM)',
                  'sourceUrl': 'https://www.bipm.org/en/countries/jp',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': 'BIPMの日本国ページで、日本が1885年10月9日にメートル条約加盟国となったことを確認。',
              },
          }

          with path.open(encoding='utf-8', newline='') as source:
              reader = csv.DictReader(source)
              fieldnames = reader.fieldnames
              rows = list(reader)

          if fieldnames is None:
              raise SystemExit('Review CSV has no header')
          if len(rows) != 103:
              raise SystemExit(f'Expected 103 review rows, found {len(rows)}')

          seen = set()
          for row in rows:
              question_id = row['questionId']
              if question_id in updates:
                  row.update(updates[question_id])
                  seen.add(question_id)

          missing = sorted(set(updates) - seen)
          if missing:
              raise SystemExit(f'Missing approval targets: {missing}')
          if len(seen) != 6:
              raise SystemExit(f'Expected 6 approval targets, found {len(seen)}')

          with path.open('w', encoding='utf-8', newline='') as target:
              writer = csv.DictWriter(target, fieldnames=fieldnames, lineterminator='\r\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate approval CSV without writing
        id: review_dry_run
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          dart run tool/content_review.dart import \
            --input review/content_review_batch_1.csv \
            2>&1 | tee build/reports/content_review_import.log

      - name: Upload approval import diagnostics
        if: steps.review_dry_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: content-review-import-diagnostics
          path: build/reports/content_review_import.log
          if-no-files-found: error

      - name: Fail on invalid approval CSV
        if: steps.review_dry_run.outcome == 'failure'
        run: exit 1

      - name: Apply approval CSV
        run: dart run tool/content_review.dart import --input review/content_review_batch_1.csv --write

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            review/content_review_batch_1.csv \
            assets/data/questions.json \
            assets/data/cards.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Apply verified content approval batch 1"
          git push origin HEAD:agent/content-approval-batch-1
