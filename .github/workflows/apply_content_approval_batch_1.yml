name: Apply content approval batch 1

on:
  push:
    branches:
      - agent/content-approval-batch-1
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approval branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-approval-batch-1
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Normalize review CSV quoting
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('review/content_review_batch_1.csv')
          with path.open(encoding='utf-8', newline='') as source:
              rows = list(csv.reader(source))

          expected = len(rows[0])
          normalized = [rows[0]]
          for line_number, row in enumerate(rows[1:], start=2):
              if len(row) < expected:
                  raise SystemExit(
                      f'CSV row {line_number} has {len(row)} columns; expected {expected}'
                  )
              if len(row) > expected:
                  overflow = len(row) - expected
                  row = row[:5] + [','.join(row[5:6 + overflow])] + row[6 + overflow:]
              if len(row) != expected:
                  raise SystemExit(
                      f'CSV row {line_number} could not be normalized safely'
                  )
              normalized.append(row)

          with path.open('w', encoding='utf-8', newline='') as target:
              writer = csv.writer(target, lineterminator='\r\n')
              writer.writerows(normalized)
          PY

      - name: Validate approval CSV without writing
        id: review_dry_run
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          dart run tool/content_review.dart import \
            --input review/content_review_batch_1.csv \
            2>&1 | tee build/reports/content_review_import.log

      - name: Upload approval import diagnostics
        if: steps.review_dry_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: content-review-import-diagnostics
          path: build/reports/content_review_import.log
          if-no-files-found: error

      - name: Fail on invalid approval CSV
        if: steps.review_dry_run.outcome == 'failure'
        run: exit 1

      - name: Apply approval CSV
        run: dart run tool/content_review.dart import --input review/content_review_batch_1.csv --write

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            review/content_review_batch_1.csv \
            assets/data/questions.json \
            assets/data/cards.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Apply verified content approval batch 1"
          git push origin HEAD:agent/content-approval-batch-1
