name: Extract 23-pair source audit inventory

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'agent/re-audit-23-sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Extract target pairs
        run: dart run tool/agent_extract_23_source_audit.dart
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record 23-pair source audit inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
