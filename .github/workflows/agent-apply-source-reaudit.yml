name: Apply 23-pair source re-audit

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/re-audit-23-sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply direct source re-audit
        run: dart run tool/agent_apply_source_reaudit.dart
      - name: Format and verify
        run: |
          dart format lib tool test
          dart run tool/generate_content_bundle.dart --check
          dart run tool/validate_semantic_reviews.dart
          dart run tool/validate_content.dart
          dart run tool/audit_content_sources.dart --require-approved
          flutter analyze
          flutter test
          git diff --check
      - name: Commit verified source audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: replace 23 placeholder sources with direct evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
