name: PR 54 Maintenance

on:
  push:
    branches:
      - agent/price-comparison-feature

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/price-comparison-feature
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: >-
          dart format
          lib/domain/models/price_comparison.dart
          lib/domain/models/source_metadata.dart
          lib/domain/services/price_calculator.dart
          lib/features/comparison/price_comparison_screen.dart
          lib/features/settings/settings_screen.dart
          test/domain/services/price_calculator_test.dart
          test/content_review/content_risk_classifier_real_data_test.dart
          test/features/daily_question_update_idempotency_test.dart

      - name: Regenerate content bundle
        run: dart run tool/generate_content_bundle.dart

      - name: Commit maintenance changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No maintenance changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: format PR and refresh generated content"
          git push origin HEAD:agent/price-comparison-feature
