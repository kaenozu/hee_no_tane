name: Apply Atacama content correction

on:
  push:
    branches:
      - agent/content-triage-and-correction
    paths:
      - .github/workflows/apply-atacama-content.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-triage-and-correction
          fetch-depth: 0

      - name: Apply source-backed Atacama replacement
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          questions_path = Path('assets/data/questions.json')
          cards_path = Path('assets/data/cards.json')
          corrections_path = Path('review/content_corrections_batch_1.csv')
          research_path = Path('review/content_research_q_geo_004.md')

          questions = json.loads(questions_path.read_text(encoding='utf-8'))
          cards = json.loads(cards_path.read_text(encoding='utf-8'))

          question = next(item for item in questions if item['id'] == 'q_geo_004')
          card = next(item for item in cards if item['id'] == 'card_geo_004')

          expected_question = {
              'question': '地球上でいちばん乾燥した場所は？',
              'choices': ['サハラ砂漠', 'アタカマ砂漠', 'ゴビ砂漠', 'モハーベ砂漠'],
              'answerIndex': 1,
              'explanation': 'チリのアタカマ砂漠は、過去400年以上雨が降っていない記録がある地域もある、世界で最も乾燥した場所なんだ。',
              'relatedCardId': 'card_geo_004',
          }
          for key, value in expected_question.items():
              if question.get(key) != value:
                  raise SystemExit(f'q_geo_004 changed unexpectedly: {key}={question.get(key)!r}')

          expected_card = {
              'title': 'アタカマ砂漠',
              'shortText': '世界で最も乾燥した場所。',
              'detailText': 'チリのアタカマ砂漠は、400年以上雨が降っていない地域がある世界一乾燥した砂漠。火星に似た環境としても有名。',
          }
          for key, value in expected_card.items():
              if card.get(key) != value:
                  raise SystemExit(f'card_geo_004 changed unexpectedly: {key}={card.get(key)!r}')

          source = {
              'title': 'A microbial oasis in the hypersaline Atacama subsurface discovered by a life detector chip: implications for the search for life on Mars',
              'publisher': 'Astrobiology (Mary Ann Liebert, Inc.)',
              'url': 'https://pubmed.ncbi.nlm.nih.gov/22149750/',
              'verifiedAt': '2026-07-13',
              'verificationLevel': 'primary',
              'reviewStatus': 'approved',
          }

          question.update({
              'question': '2009年、火星を想定した掘削調査で生命検出チップが試験された砂漠は？',
              'answerIndex': 1,
              'explanation': '研究チームはチリのアタカマ砂漠で火星を想定した掘削調査を行い、生命検出チップを現地で試験した。この技術は、火星で生命を探すための惑星探査技術として評価された。',
              'sourceNote': 'Parroほか（2011）Astrobiology',
              'verified': True,
              'source': source,
          })

          card.update({
              'title': '火星探査とアタカマ砂漠',
              'shortText': '火星の生命探査技術が試験された。',
              'detailText': '2009年、研究チームはチリのアタカマ砂漠で火星を想定した掘削調査を行い、生命検出チップを現地で試験した。検出技術は、火星で生命を探すための惑星探査技術として評価された。',
              'sourceNote': 'Parroほか（2011）Astrobiology',
              'source': source,
          })

          questions_path.write_text(
              json.dumps(questions, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          cards_path.write_text(
              json.dumps(cards, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          correction_id = ('q_geo_004', 'card_geo_004')
          with corrections_path.open('r', encoding='utf-8', newline='') as handle:
              existing = list(csv.DictReader(handle))
          if any((row['questionId'], row['cardId']) == correction_id for row in existing):
              raise SystemExit('q_geo_004 correction row already exists')

          with corrections_path.open('a', encoding='utf-8', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow([
                  'q_geo_004',
                  'card_geo_004',
                  'question,explanation,card',
                  'ranking,numeric,historical-claim',
                  '乾燥度の世界一と400年以上無降水の一般化を削除し、2009年にアタカマ砂漠で実施された火星類似掘削調査と生命検出チップの現地試験へ差し替え',
                  source['title'],
                  source['publisher'],
                  source['url'],
                  source['verifiedAt'],
                  source['verificationLevel'],
                  source['reviewStatus'],
              ])

          research_path.write_text('''# `q_geo_004` / `card_geo_004` 調査・修正記録

確認日: 2026-07-13
対象ブランチ: `agent/content-triage-and-correction`
判定: 原著論文が修正文全文を直接支えるため、問題とカードを修正して承認

## 監査対象だった主張

### 問題

- アタカマ砂漠が「地球上でいちばん乾燥した場所」である
- アタカマ砂漠の一部には400年以上雨が降っていない記録がある

### カード

- アタカマ砂漠が世界で最も乾燥した場所である
- 400年以上雨が降っていない地域がある
- 火星に似た環境として知られる

## 問題点と反証

- 「地球上でいちばん乾燥した場所」は、極地を含むか、砂漠だけを比較するか、降水量・相対湿度・土壌水分のどれを指標にするかが定義されていない。
- 南極のドライバレーなどが比較対象になり得るため、現行の設問では正答の一意性を保証できない。
- 「400年以上」は特定地点・期間・資料の条件を明示せず砂漠全体の特徴として一般化している。
- 火星類似環境という主張は乾燥ランキングとは別の主張であり、独立した直接資料が必要である。

このため、ランキングと400年以上の主張は修正文に残さない。

## 採用した一次資料

- 論文: `A microbial oasis in the hypersaline Atacama subsurface discovered by a life detector chip: implications for the search for life on Mars`
- 著者: Victor Parroほか
- 掲載誌: `Astrobiology`, 2011年, 11巻10号, 969–996頁
- DOI: `10.1089/ast.2011.0654`
- PubMed: https://pubmed.ncbi.nlm.nih.gov/22149750/

## 直接確認した事実

PubMed掲載の原著論文抄録から次を確認した。

1. アタカマ砂漠は惑星探査用機器を試験する火星類似環境として扱われている。
2. 研究チームは2009年7月、チリのアタカマ砂漠にあるSalar Grande付近で火星類似の掘削調査を実施した。
3. 最大5mの深さから試料を採取し、300抗体を備えた生命検出チップ`LDChip300`で現地分析した。
4. 論文は、この検出技術の性能が惑星探査、特に火星での生命探索向けに有効であると評価している。

## 採用しない主張

- `地球上でいちばん乾燥した場所`
- `世界で最も乾燥した場所`
- `世界一乾燥した砂漠`
- `400年以上雨が降っていない`

これらを否定したのではなく、比較条件や対象地点を定義せずに現在の問題・カードへ載せる根拠が不足しているため削除した。

## 修正後の問題

- 問題文: `2009年、火星を想定した掘削調査で生命検出チップが試験された砂漠は？`
- 正答: `アタカマ砂漠`
- 解説: 2009年のアタカマ砂漠での掘削調査、生命検出チップの現地試験、火星生命探索向け技術としての評価だけに限定

選択肢のサハラ砂漠、ゴビ砂漠、モハーベ砂漠について「火星関連試験が一切ない」とは主張しない。設問を2009年の当該原著論文に限定することで正答を一意にした。

## 修正後のカード

- タイトル: `火星探査とアタカマ砂漠`
- shortText: `火星の生命探査技術が試験された。`
- detailText: 2009年の掘削調査と生命検出チップの現地試験に限定

## 証拠レベル

`primary`

理由: 査読済み原著論文であり、調査地点、実施年、掘削調査、使用した生命検出チップ、技術評価を研究者自身が報告しているため。

## 承認条件の自己点検

- 問題前提: 原著論文が直接支える
- 正答の一意性: 2009年の当該調査に限定したため成立
- 日付: 原著論文の抄録で2009年7月を確認
- 数値: 問題本文では不要な深度・抗体数を出さず、調査記録にのみ保存
- 因果: 追加していない
- 類推: 火星そのものと同一環境とは書いていない
- 問題とカードの出典URL: 同一
- 未確認主張の残存: なし

## 再検証条件

- 問題文へ乾燥度ランキングや無降水期間を再追加する場合
- 2009年以外のNASA・ESA等の別試験へ本文を広げる場合
- `火星と同じ環境`など、部分的な類似を同一性へ強める場合
''', encoding='utf-8')

          # The workflow exists only to apply this guarded transformation.
          Path('.github/workflows/apply-atacama-content.yml').unlink()
          PY

      - name: Verify targeted diff
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path

          questions = json.loads(Path('assets/data/questions.json').read_text(encoding='utf-8'))
          cards = json.loads(Path('assets/data/cards.json').read_text(encoding='utf-8'))
          q = next(item for item in questions if item['id'] == 'q_geo_004')
          c = next(item for item in cards if item['id'] == 'card_geo_004')
          assert q['answerIndex'] == 1
          assert q['source']['reviewStatus'] == 'approved'
          assert q['source']['verificationLevel'] == 'primary'
          assert q['source']['url'] == c['source']['url']
          assert '400年' not in q['explanation']
          assert '400年' not in c['detailText']
          assert '世界で最も乾燥' not in q['question'] + q['explanation'] + c['shortText'] + c['detailText']
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/apply-atacama-content.yml' \
            'assets/data/cards.json' \
            'assets/data/questions.json' \
            'review/content_corrections_batch_1.csv' \
            'review/content_research_q_geo_004.md' | sort)"
          test "$changed" = "$expected"

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: replace unsupported Atacama ranking claim"
          git push origin HEAD:agent/content-triage-and-correction
