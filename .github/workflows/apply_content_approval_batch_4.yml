name: Apply content approval batch 4

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approval branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-approval-batch-4
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate review CSV and apply verified row
        shell: bash
        run: |
          dart run tool/content_review.dart export \
            --output review/content_review_batch_4.csv
          python3 - <<'PY'
          import csv
          from pathlib import Path

          path = Path('review/content_review_batch_4.csv')
          updates = {
              'q_food_012': {
                  'sourceTitle': '期限表示とは',
                  'sourcePublisher': '消費者庁',
                  'sourceUrl': 'https://www.caa.go.jp/policies/policy/food_labeling/food_sanitation/expiration_date/assets/food_labeling_cms204_250331_01.pdf',
                  'verifiedAt': '2026-07-12',
                  'verificationLevel': 'primary',
                  'reviewStatus': 'approved',
                  'reviewNote': '消費者庁資料で、消費期限は安全性を欠くおそれがないと認められる期限で傷みやすい食品に表示され、賞味期限は期待される品質を十分に保持できる期限で日持ちする食品に表示されることを確認。',
              },
          }

          with path.open(encoding='utf-8', newline='') as source:
              reader = csv.DictReader(source)
              fieldnames = reader.fieldnames
              rows = list(reader)

          if fieldnames is None:
              raise SystemExit('Review CSV has no header')
          if len(rows) != 103:
              raise SystemExit(f'Expected 103 review rows, found {len(rows)}')

          seen = set()
          for row in rows:
              question_id = row['questionId']
              if question_id in updates:
                  if row['reviewStatus'] == 'approved':
                      raise SystemExit(f'Approval target is already approved: {question_id}')
                  row.update(updates[question_id])
                  seen.add(question_id)

          missing = sorted(set(updates) - seen)
          if missing:
              raise SystemExit(f'Missing approval targets: {missing}')
          if len(seen) != 1:
              raise SystemExit(f'Expected 1 approval target, found {len(seen)}')

          with path.open('w', encoding='utf-8', newline='') as target:
              writer = csv.DictWriter(target, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Validate approval CSV without writing
        run: dart run tool/content_review.dart import --input review/content_review_batch_4.csv

      - name: Apply approval CSV
        run: dart run tool/content_review.dart import --input review/content_review_batch_4.csv --write

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            review/content_review_batch_4.csv \
            assets/data/questions.json \
            assets/data/cards.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Apply verified content approval batch 4"
          git push origin HEAD:agent/content-approval-batch-4
