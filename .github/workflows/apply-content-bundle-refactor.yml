name: Apply content bundle refactor

on:
  push:
    branches:
      - agent/content-bundle-daily-assignment
    paths:
      - .github/run-content-bundle-refactor

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/content-bundle-daily-assignment
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply source refactor
        run: python3 tool/apply_content_bundle_refactor.py

      - name: Format Dart sources
        run: dart format lib test integration_test tool

      - name: Generate approved content bundle
        run: dart run tool/generate_content_bundle.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Remove temporary automation
        run: |
          rm -f tool/apply_content_bundle_refactor.py
          rm -f .github/run-content-bundle-refactor
          rm -f .github/workflows/apply-content-bundle-refactor.yml

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Complete content bundle and daily assignment refactor"
          git push origin HEAD:agent/content-bundle-daily-assignment
