name: Format PR105 files

on:
  push:
    branches:
      - agent/24-runtime-manifest-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/24-runtime-manifest-contract
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply canonical formatter and remove helper
        run: |
          dart format tool/validate_content.dart tool/validate_runtime_content.dart
          rm .github/workflows/format-pr105.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format RC1 validators'
          git push origin HEAD:agent/24-runtime-manifest-contract
