name: PR 54 Master Validation

on:
  push:
    branches:
      - agent/price-comparison-feature

permissions:
  contents: write

jobs:
  validate-master:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/price-comparison-feature
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Check out master worktree
        run: |
          git fetch origin master
          git worktree add /tmp/hee-no-tane-master origin/master

      - name: Install dependencies
        working-directory: /tmp/hee-no-tane-master
        run: flutter pub get

      - name: Run repaired tests
        working-directory: /tmp/hee-no-tane-master
        run: >-
          flutter test
          test/content_review/content_risk_classifier_real_data_test.dart
          test/features/daily_question_update_idempotency_test.dart

      - name: Record successful validation
        run: |
          printf '%s\n' "master 20f227daccb16a5963971e85e82830309a4ff103: repaired tests passed" > .github/pr54-master-validation-passed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr54-master-validation-passed
          git commit -m "test: record PR 54 master validation"
          git push origin HEAD:agent/price-comparison-feature
