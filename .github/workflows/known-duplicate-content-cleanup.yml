name: Known duplicate content cleanup

on:
  push:
    branches:
      - agent/known-duplicate-content-cleanup

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/known-duplicate-content-cleanup
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Correct helper-only assertions and wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_known_duplicate_cleanup.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"カード遊びに関する逸話は、直接資料で確認できないため扱わない。"',
              '"料理名は個人名ではなく、爵位名の「Sandwich」から広まった。"',
          )
          text = text.replace(
              'if "タコ" in by_id["q_living_things_006"]["question"]:',
              'if "心臓" in by_id["q_living_things_006"]["question"]:',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply content replacements
        run: python3 .github/scripts/apply_known_duplicate_cleanup.py prepare

      - name: Format updated regression test
        run: dart format test/content_review/content_risk_classifier_real_data_test.dart

      - name: Export review CSV and attach primary sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          dart run tool/content_review.dart export \
            --output build/reports/content_review.csv
          python3 .github/scripts/apply_known_duplicate_cleanup.py approve-csv \
            build/reports/content_review.csv

      - name: Validate and import review metadata
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/content_review.dart import \
            --input build/reports/content_review.csv
          dart run tool/content_review.dart import \
            --input build/reports/content_review.csv --write
          python3 .github/scripts/apply_known_duplicate_cleanup.py update-manifest

      - name: Regenerate committed review artifacts
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/content_review.dart export \
            --output build/reports/content_review.csv
          dart run tool/content_review.dart risk \
            --output build/reports/content_review_risks.csv
          cp build/reports/content_review.csv review/content_review_batch_3.csv
          cp build/reports/content_review_risks.csv review/content_review_batch_3_risks.csv
          python3 .github/scripts/apply_known_duplicate_cleanup.py verify-risk \
            build/reports/content_review_risks.csv

      - name: Validate content and source metadata
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/validate_content.dart
          dart run tool/audit_content_sources.dart --require-approved
          dart run tool/generate_release_blockers.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary automation files
        shell: bash
        run: |
          rm -f .github/scripts/apply_known_duplicate_cleanup.py
          rm -f .github/workflows/known-duplicate-content-cleanup.yml
          rmdir .github/scripts 2>/dev/null || true

      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "content: resolve known duplicate facts"
          git push origin HEAD:agent/known-duplicate-content-cleanup
