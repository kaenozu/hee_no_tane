name: Price Comparison Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/data/repositories/comparison_repository.dart \
            lib/domain/price_comparison \
            lib/features/comparison \
            lib/features/home/daily_assignment_gate.dart \
            lib/features/home/pinned_daily_question_service.dart \
            test/data/repositories/comparison_repository_test.dart \
            test/domain/price_comparison \
            test/features/comparison

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run price comparison tests
        run: |
          flutter test \
            test/domain/price_comparison \
            test/data/repositories/comparison_repository_test.dart \
            test/features/comparison

      - name: Run full test suite
        id: full-tests
        shell: bash
        run: |
          set +e
          flutter test > full-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 full-test.log
          exit 0

      - name: Upload full test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: price-comparison-full-test-log
          path: full-test.log
          if-no-files-found: error

      - name: Build web
        run: flutter build web

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Fail on full test errors
        if: steps.full-tests.outputs.status != '0'
        run: exit 1
