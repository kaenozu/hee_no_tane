name: Apply q_bio_002 correction

on:
  push:
    branches:
      - agent/content-triage-and-correction
    paths:
      - .github/workflows/apply-q-bio-002.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-triage-and-correction
          fetch-depth: 3

      - name: Apply source-backed correction
        run: python .github/scripts/apply_q_bio_002.py

      - name: Guard final combined diff and push
        shell: bash
        run: |
          set -euo pipefail
          stable_head=9814561f48b55dfcfdc73da33e99aa208a3c7347
          actual_stable_head="$(git rev-parse HEAD~2)"
          if [[ "$actual_stable_head" != "$stable_head" ]]; then
            echo "Unexpected stable parent: $actual_stable_head" >&2
            exit 1
          fi

          git add -A

          expected_files="$(printf '%s\n' \
            assets/data/cards.json \
            assets/data/questions.json \
            review/content_corrections_batch_1.csv \
            review/content_research_q_bio_002.md | sort)"
          actual_files="$(git diff --cached --name-only "$stable_head" | sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "Unexpected final combined diff:" >&2
            printf '%s\n' "$actual_files" >&2
            exit 1
          fi

          git diff --cached --check "$stable_head"
          python -m json.tool assets/data/questions.json >/dev/null
          python -m json.tool assets/data/cards.json >/dev/null

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "content: correct whale-heart specimen claims"
          git push origin HEAD:agent/content-triage-and-correction
