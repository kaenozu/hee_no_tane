name: Normalize content review CSV output

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/known-duplicate-content-cleanup
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Switch generated CSV output to LF and add regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lib/content_review/content_review_workflow.dart'): [
                  (
                      "'${rows.map((row) => row.map(_escapeCsv).join(',')).join('\\r\\n')}\\r\\n';",
                      "'${rows.map((row) => row.map(_escapeCsv).join(',')).join('\\n')}\\n';",
                  ),
              ],
              Path('lib/content_review/content_risk_classifier.dart'): [
                  (
                      "return '${rows.map((row) => row.map(_escapeCsv).join(',')).join('\\r\\n')}\\r\\n';",
                      "return '${rows.map((row) => row.map(_escapeCsv).join(',')).join('\\n')}\\n';",
                  ),
              ],
              Path('test/content_review/content_review_workflow_test.dart'): [
                  ("expect(csv.split('\\r\\n').first, contentReviewColumns.join(','));",
                   "expect(csv.split('\\n').first, contentReviewColumns.join(','));\n    expect(csv, isNot(contains('\\r')));"),
                  ("'${rows.map((row) => row.map(_csvValue).join(',')).join('\\r\\n')}\\r\\n';",
                   "'${rows.map((row) => row.map(_csvValue).join(',')).join('\\n')}\\n';"),
              ],
              Path('test/content_review/content_risk_classifier_test.dart'): [
                  ("enhanced.split('\\r\\n').first,", "enhanced.split('\\n').first,"),
                  ("expect(stripped.split('\\r\\n').first, contentReviewColumns.join(','));",
                   "expect(stripped.split('\\n').first, contentReviewColumns.join(','));\n    expect(enhanced, isNot(contains('\\r')));\n    expect(stripped, isNot(contains('\\r')));"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Format Dart changes
        run: dart format lib/content_review/content_review_workflow.dart lib/content_review/content_risk_classifier.dart test/content_review/content_review_workflow_test.dart test/content_review/content_risk_classifier_test.dart

      - name: Regenerate committed CSV artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          dart run tool/content_review.dart export --output build/reports/content_review.csv
          dart run tool/content_review.dart risk --output build/reports/content_review_risks.csv
          cp build/reports/content_review.csv review/content_review_batch_3.csv
          cp build/reports/content_review_risks.csv review/content_review_batch_3_risks.csv
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'review/content_review_batch_3.csv',
              'review/content_review_batch_3_risks.csv',
          ):
              data = Path(name).read_bytes()
              if b'\r' in data:
                  raise SystemExit(f'{name} still contains CR bytes')
          PY

      - name: Validate content and sources
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/validate_content.dart
          dart run tool/audit_content_sources.dart --require-approved
          dart run tool/generate_release_blockers.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check whitespace
        run: git diff --check

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-content-review-csv-line-endings.yml

      - name: Commit validated line-ending fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: emit content review CSV with LF endings"
          git push origin HEAD:agent/known-duplicate-content-cleanup
