name: Finalize Retry Reward State Fix

on:
  push:
    branches:
      - agent/v1-release-preparation
  pull_request:
    types:
      - reopened
  workflow_dispatch:

concurrency:
  group: retry-reward-finalizer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.actor == 'kaenozu'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/v1-release-preparation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/application/daily_progress_service.dart lib/features/question/daily_question_screen.dart test/features/daily_question_update_idempotency_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/diagnostics
          flutter test 2>&1 | tee build/diagnostics/finalizer-test.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retry-reward-finalizer-test-log-${{ github.run_id }}
          path: build/diagnostics/finalizer-test.log
          if-no-files-found: error

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/finalize-retry-reward-state.yml

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve new-card state across save retry'
          git push origin HEAD:agent/v1-release-preparation
