name: Finalize Retry Reward State Fix

on:
  push:
    branches:
      - agent/v1-release-preparation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'kaenozu'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/v1-release-preparation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/application/daily_progress_service.dart lib/features/question/daily_question_screen.dart

      - name: Analyze
        run: flutter analyze

      - name: Run full test suite
        run: flutter test

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-retry-reward-state.yml

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve new-card state across save retry'
          git push origin HEAD:agent/v1-release-preparation
