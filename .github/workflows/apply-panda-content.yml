name: Apply panda content correction

on:
  push:
    branches:
      - agent/content-triage-and-correction
    paths:
      - .github/workflows/apply-panda-content.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-triage-and-correction

      - name: Update panda question and card
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = {
              "title": "Giant pandas",
              "publisher": "World Wildlife Fund (WWF)",
              "url": "https://www.worldwildlife.org/species/giant-panda/",
              "verifiedAt": "2026-07-13",
              "verificationLevel": "secondary",
              "reviewStatus": "approved",
          }

          questions_path = Path("assets/data/questions.json")
          questions = json.loads(questions_path.read_text(encoding="utf-8"))
          matches = [item for item in questions if item.get("id") == "q_bio_005"]
          if len(matches) != 1:
              raise SystemExit(f"expected one q_bio_005, found {len(matches)}")
          question = matches[0]
          question["question"] = "ジャイアントパンダが主に食べるものは？"
          question["explanation"] = "ジャイアントパンダは、ほぼ竹だけを食べて暮らしている。WWFによると、竹の部位に応じて1日に約12〜38kgを食べる。"
          question["sourceNote"] = "WWF「Giant pandas」"
          question["verified"] = True
          question["source"] = source.copy()
          questions_path.write_text(
              json.dumps(questions, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          cards_path = Path("assets/data/cards.json")
          cards = json.loads(cards_path.read_text(encoding="utf-8"))
          matches = [item for item in cards if item.get("id") == "card_bio_005"]
          if len(matches) != 1:
              raise SystemExit(f"expected one card_bio_005, found {len(matches)}")
          card = matches[0]
          card["title"] = "パンダと竹"
          card["shortText"] = "ほぼ竹だけを食べて暮らす。"
          card["detailText"] = "ジャイアントパンダは、ほぼ竹だけを食べて暮らしている。WWFによると、竹の部位に応じて1日に約12〜38kgを食べる。"
          card["sourceNote"] = "WWF「Giant pandas」"
          card["source"] = source.copy()
          cards_path.write_text(
              json.dumps(cards, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify targeted semantic changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          questions = json.loads(Path("assets/data/questions.json").read_text(encoding="utf-8"))
          cards = json.loads(Path("assets/data/cards.json").read_text(encoding="utf-8"))
          question = next(item for item in questions if item["id"] == "q_bio_005")
          card = next(item for item in cards if item["id"] == "card_bio_005")
          assert question["answerIndex"] == 1
          assert question["choices"][1] == "竹"
          assert question["source"]["reviewStatus"] == "approved"
          assert card["source"] == question["source"]
          assert "99%" not in question["explanation"]
          assert "99%" not in card["detailText"]
          assert "12〜38kg" in question["explanation"]
          assert "12〜38kg" in card["detailText"]
          PY

      - name: Commit content update and remove temporary workflow
        run: |
          rm .github/workflows/apply-panda-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/questions.json assets/data/cards.json .github/workflows/apply-panda-content.yml
          git commit -m "content: correct and approve panda diet pair"
          git push origin HEAD:agent/content-triage-and-correction
