name: PR80 source migration

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-final-card-images-batch
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Update source reviews and regenerate bundle
        run: |
          python3 tool/apply_pr80_image_review.py
          dart run tool/generate_content_bundle.dart
          dart run tool/generate_content_bundle.dart --check
      - name: Commit regenerated source and artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/cards.json assets/data/content_bundle.json assets/data/content_manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix: persist pending image reviews in source data'
          git push origin HEAD:agent/v1-final-card-images-batch
