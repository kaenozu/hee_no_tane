name: Apply giraffe sleep correction

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 30 &&
      github.event.pull_request.head.ref == 'agent/content-triage-and-correction'
    runs-on: ubuntu-latest
    steps:
      - name: Create guarded content commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'agent/content-triage-and-correction';
            const workflowPath = '.github/workflows/apply-giraffe-sleep-correction.yml';
            const questionsPath = 'assets/data/questions.json';
            const cardsPath = 'assets/data/cards.json';
            const correctionsPath = 'review/content_corrections_batch_1.csv';
            const researchPath = 'review/content_research_q_living_things_002.md';

            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parentSha = ref.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });

            async function readText(path) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`${path} is not a file`);
              }
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            function assertEqual(actual, expected, label) {
              if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(`${label} changed unexpectedly\nactual=${JSON.stringify(actual)}\nexpected=${JSON.stringify(expected)}`);
              }
            }

            const questions = JSON.parse(await readText(questionsPath));
            const cards = JSON.parse(await readText(cardsPath));
            const correctionsText = await readText(correctionsPath);

            const question = questions.find((item) => item.id === 'q_living_things_002');
            const card = cards.find((item) => item.id === 'card_living_things_002');
            if (!question || !card) throw new Error('target question/card not found');

            assertEqual(
              {
                category: question.category,
                difficulty: question.difficulty,
                question: question.question,
                choices: question.choices,
                answerIndex: question.answerIndex,
                explanation: question.explanation,
                relatedCardId: question.relatedCardId,
                sourceNote: question.sourceNote,
                verified: question.verified,
                hasSource: Object.prototype.hasOwnProperty.call(question, 'source'),
              },
              {
                category: 'living_things',
                difficulty: 'normal',
                question: '野生のキリンの1日の平均睡眠時間は、だいたいどれくらいの長さだと言われているでしょうか？',
                choices: ['約20分', '約4時間', '約8時間', '約12時間'],
                answerIndex: 0,
                explanation: '野生のキリンは肉食獣などの天敵から身を守るため、非常に短い睡眠をとります。1回数分程度の「うたた寝」を細切れに繰り返し、1日の合計睡眠時間はわずか20分程度と言われています。動物界でも屈指の短眠家として有名です。',
                relatedCardId: 'card_living_things_002',
                sourceNote: 'ナショナルジオグラフィック 日本版',
                verified: true,
                hasSource: false,
              },
              'q_living_things_002',
            );

            assertEqual(
              {
                title: card.title,
                category: card.category,
                shortText: card.shortText,
                detailText: card.detailText,
                imageAsset: card.imageAsset,
                rarity: card.rarity,
                sourceNote: card.sourceNote,
                hasSource: Object.prototype.hasOwnProperty.call(card, 'source'),
              },
              {
                title: 'キリンの超短眠術',
                category: 'living_things',
                shortText: '世界で最も睡眠時間が短いといわれる動物。',
                detailText: 'キリンは立ったまま数分間の眠りを繰り返します。深い眠りにつくのは稀で、首を丸めて座って眠る姿は非常に珍しい光景です。厳しい自然界を生き抜くための究極の適応といえます。',
                imageAsset: 'assets/images/cards/card_living_things_002.png',
                rarity: 'rare',
                sourceNote: 'ナショナルジオグラフィック 日本版',
                hasSource: false,
              },
              'card_living_things_002',
            );

            if (correctionsText.includes('q_living_things_002,card_living_things_002')) {
              throw new Error('correction CSV row already exists');
            }

            const source = {
              title: 'Behavioural sleep in the giraffe (Giraffa camelopardalis) in a zoological garden',
              publisher: 'Journal of Sleep Research',
              url: 'https://pubmed.ncbi.nlm.nih.gov/8795798/',
              verifiedAt: '2026-07-13',
              verificationLevel: 'primary',
              reviewStatus: 'approved',
            };

            Object.assign(question, {
              question: '1996年に発表されたキリンの行動睡眠研究で、観察場所として題名に示されているのは？',
              choices: ['動物園', '野生のサバンナ', '大学の睡眠実験室', '海洋公園'],
              answerIndex: 0,
              explanation: 'ToblerとSchwierinが1996年に発表した論文の題名は「動物園におけるキリンの行動睡眠」で、観察場所として動物園が示されている。',
              sourceNote: 'Tobler・Schwierin（1996）Journal of Sleep Research',
              verified: true,
              source,
            });

            Object.assign(card, {
              title: '動物園で調べたキリンの睡眠',
              shortText: '1996年の行動睡眠研究は動物園が対象。',
              detailText: 'ToblerとSchwierinは、動物園におけるキリンの行動睡眠を報告した。論文は1996年にJournal of Sleep Researchへ掲載された。',
              sourceNote: 'Tobler・Schwierin（1996）Journal of Sleep Research',
              source,
            });

            function csvEscape(value) {
              const text = String(value);
              return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
            }

            const correctionRow = [
              'q_living_things_002',
              'card_living_things_002',
              'question,choices,answer,explanation,card',
              'numeric,behavioral-variation,causality,ranking',
              '野生個体の平均睡眠20分、捕食回避の因果、細切れ睡眠、世界最短の断定を削除し、1996年の原著論文の題名と書誌情報が直接支える動物園での行動睡眠研究へ差し替え',
              source.title,
              source.publisher,
              source.url,
              source.verifiedAt,
              source.verificationLevel,
              source.reviewStatus,
            ].map(csvEscape).join(',');

            const updatedCorrections = `${correctionsText.replace(/\s*$/, '')}\n${correctionRow}\n`;
            const updatedQuestions = `${JSON.stringify(questions, null, 2)}\n`;
            const updatedCards = `${JSON.stringify(cards, null, 2)}\n`;

            const researchText = `# \`q_living_things_002\` / \`card_living_things_002\` 調査・修正記録

確認日: 2026-07-13
対象ブランチ: \`agent/content-triage-and-correction\`
判定: 数値・行動・因果の断定を削除し、原著論文の題名と書誌情報が直接支える内容へ差し替えて承認

## 監査対象だった主張

### 問題

- 野生のキリンの1日平均睡眠時間は約20分
- 捕食者から身を守るため睡眠時間が短い
- 1回数分の睡眠を細切れに繰り返す
- 動物界でも屈指の短眠動物である

### カード

- 世界で最も睡眠時間が短い動物である
- 立ったまま数分の睡眠を繰り返す
- 深い睡眠は稀である
- 首を丸めて座る睡眠姿勢は非常に珍しい
- これらは自然界を生き抜くための適応である

## メタ認知による問題点

- \`20分\`は野生個体全体の固定平均として提示されていたが、対象個体、観察期間、睡眠判定法が示されていなかった。
- 飼育下研究の値を野生一般へ転用すると、母集団と観察条件が一致しない。
- 捕食回避と睡眠時間の因果は、睡眠時間の観察値だけからは導けない。
- \`世界で最も短い\`は比較対象、測定法、研究条件を統一したランキング資料が必要である。
- 立位、横臥、REM、休息、行動睡眠を区別せず一つの睡眠概念として扱っていた。

## 採用した一次資料

- Title: \`Behavioural sleep in the giraffe (Giraffa camelopardalis) in a zoological garden\`
- Authors: I. Tobler, B. Schwierin
- Journal: \`Journal of Sleep Research\`
- Year: 1996
- Volume/issue/pages: 5(1), 21–32
- DOI: \`10.1046/j.1365-2869.1996.00010.x\`
- PMID: \`8795798\`
- Record: https://pubmed.ncbi.nlm.nih.gov/8795798/

## 直接確認できた事実

原著論文の題名と書誌情報から、次だけを採用した。

1. 研究対象はキリンの行動睡眠である。
2. 題名は観察場所を動物園と明示している。
3. 論文は1996年に\`Journal of Sleep Research\`へ掲載された。

## 直接確認できなかった情報

- 24時間あたり4.6時間という値の原著本文での表記
- 4.6時間が平均、中央値、別の統計量のどれか
- 個体数、年齢、性別
- 観察期間、睡眠の判定基準
- 睡眠が主に夜間だったか
- 立位睡眠、横臥睡眠、REM睡眠の時間

二次資料には飼育下で約4.6時間という記述があるが、原著本文または抄録を直接取得できなかったため、問題・カードには採用していない。

## 採用しない主張

- \`野生のキリンの平均睡眠は約20分\`
- \`天敵から身を守るため短時間睡眠になった\`
- \`数分の眠りを細切れに繰り返す\`
- \`世界で最も睡眠時間が短い\`
- \`深い睡眠は稀\`
- \`首を丸めて座る姿は非常に珍しい\`
- \`究極の適応\`

これらをすべて否定したのではなく、現在の対象・数値・因果・比較条件を直接支える一次資料を確保できなかったため削除した。

## 修正後の問題

- 問題文: \`1996年に発表されたキリンの行動睡眠研究で、観察場所として題名に示されているのは？\`
- 正答: \`動物園\`
- 解説: 原著論文の題名と掲載年だけに限定

選択肢は当該論文の題名に照らして一意であり、他の場所でキリンの睡眠研究が存在しないとは主張しない。

## 修正後のカード

- タイトル: \`動物園で調べたキリンの睡眠\`
- shortText: \`1996年の行動睡眠研究は動物園が対象。\`
- detailText: 研究対象、動物園、掲載年、掲載誌だけに限定

## 証拠レベル

\`primary\`

理由: 査読済み原著論文そのものの題名と書誌情報を根拠にし、本文には題名と書誌情報が直接支える主張だけを残したため。

## 承認条件の自己点検

- 問題前提: 原著論文の題名が直接支える
- 正答の一意性: 当該1996年論文の題名に限定したため成立
- 数値: 睡眠時間の数値を採用していない
- 対象条件: 野生一般へ拡張していない
- 因果: 捕食回避の説明を削除
- ランキング: 世界最短の主張を削除
- 問題とカードの出典URL: 同一
- 未確認主張の残存: なし

## 再検証条件

- 睡眠時間、個体数、観察期間、時間帯、睡眠段階を再追加する場合
- 飼育下研究の結果を野生個体へ広げる場合
- 捕食圧との因果や動物間ランキングを追加する場合
`;

            const blobs = {};
            for (const [path, content] of Object.entries({
              [questionsPath]: updatedQuestions,
              [cardsPath]: updatedCards,
              [correctionsPath]: updatedCorrections,
              [researchPath]: researchText,
            })) {
              const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
              blobs[path] = blob.data.sha;
            }

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.data.tree.sha,
              tree: [
                ...Object.entries(blobs).map(([path, sha]) => ({ path, mode: '100644', type: 'blob', sha })),
                { path: workflowPath, mode: '100644', type: 'blob', sha: null },
              ],
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'content: replace unsupported giraffe sleep claims',
              tree: tree.data.sha,
              parents: [parentSha],
            });

            const latestRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            if (latestRef.data.object.sha !== parentSha) {
              throw new Error(`branch moved during update: ${latestRef.data.object.sha}`);
            }

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false,
            });

            core.info(`Created guarded correction commit ${commit.data.sha}`);
