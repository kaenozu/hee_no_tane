name: Content CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out PR 80 branch for one-shot source migration
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 80 && github.actor != 'github-actions[bot]'
        run: git checkout agent/v1-final-card-images-batch

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Persist PR 80 pending image reviews and regenerate content
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 80 && github.actor != 'github-actions[bot]'
        run: |
          python3 tool/apply_pr80_image_review.py
          dart run tool/generate_content_bundle.dart
          dart run tool/generate_content_bundle.dart --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/cards.json assets/data/content_bundle.json assets/data/content_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: persist pending image reviews in source data'
            git push origin HEAD:agent/v1-final-card-images-batch
          fi

      - name: Check generated bundle
        run: dart run tool/generate_content_bundle.dart --check

      - name: Validate approved semantic reviews
        run: dart run tool/validate_semantic_reviews.dart

      - name: Validate RC1 release target
        run: dart run tool/validate_rc1_content.dart

      - name: Validate runtime content boundary
        run: dart run tool/validate_runtime_content.dart

      - name: Validate editable content sources
        run: dart run tool/validate_content.dart

      - name: Audit approved sources
        run: dart run tool/audit_content_sources.dart --require-approved

      - name: Run content and assignment tests
        run: >-
          flutter test
          test/content_validation/content_bundle_builder_test.dart
          test/content_validation/semantic_review_gate_test.dart
          test/content_validation/approved_content_semantic_regression_test.dart
          test/content_validation/rc1_content_policy_test.dart
          test/application/daily_progress_service_test.dart
