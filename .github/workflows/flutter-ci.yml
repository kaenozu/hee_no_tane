name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  capture-tests:
    if: github.event.pull_request.head.ref == 'agent/serialize-save-updates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/serialize-save-updates
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Capture test output
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          set +e
          flutter test --reporter expanded > .github/issue11-test-output.txt 2>&1
          status=$?
          set -e
          git fetch origin agent/fix-card-list-stale-save-data
          git checkout origin/agent/fix-card-list-stale-save-data -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/issue11-test-output.txt .github/workflows/flutter-ci.yml
          git commit -m "Record Issue 11 test output"
          git push origin HEAD:agent/serialize-save-updates
          exit "$status"
