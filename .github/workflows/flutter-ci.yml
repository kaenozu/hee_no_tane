name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-renderer-test:
    if: github.event.pull_request.head.ref == 'feature/card-share-image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/card-share-image
          fetch-depth: 0

      - name: Update renderer test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/features/card_share_test.dart')
          text = path.read_text()
          old = """    final bytes = await const RepaintBoundaryCardShareImageRenderer().render(
      boundaryKey,
      pixelRatio: 1.0,
    );

    expect(bytes.length, greaterThan(8));
    expect(bytes.sublist(0, 8), [137, 80, 78, 71, 13, 10, 26, 10]);
"""
          new = """    final bytes = await tester.runAsync(
      () => const RepaintBoundaryCardShareImageRenderer().render(
        boundaryKey,
        pixelRatio: 1.0,
      ),
    );

    expect(bytes, isNotNull);
    expect(bytes!.length, greaterThan(8));
    expect(bytes.sublist(0, 8), [137, 80, 78, 71, 13, 10, 26, 10]);
"""
          if old not in text:
              raise SystemExit('Renderer test block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git fetch origin master
          git checkout origin/master -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Run card renderer test outside fake async"
          git push origin HEAD:feature/card-share-image
