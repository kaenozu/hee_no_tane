name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Generate release blocker report
        run: dart run tool/generate_release_blockers.dart

      - name: Add release blocker summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f build/release-blockers.json ]]; then
            echo "## Release blockers" >> "$GITHUB_STEP_SUMMARY"
            echo "Report generation failed; no JSON report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          expected=$(jq -r '.summary.expectedPairCount' build/release-blockers.json)
          pairs=$(jq -r '.summary.pairCount' build/release-blockers.json)
          blocked=$(jq -r '.summary.blockedPairCount' build/release-blockers.json)
          unblocked=$(jq -r '.summary.unblockedPairCount' build/release-blockers.json)
          ready=$(jq -r '.summary.releaseReady' build/release-blockers.json)
          structural=$(jq -r '.summary.structuralBlockers | if length == 0 then "none" else join(", ") end' build/release-blockers.json)

          {
            echo "## Release blockers"
            echo ""
            echo "| Metric | Count / value |"
            echo "| --- | ---: |"
            echo "| Expected pairs | $expected |"
            echo "| Evaluated pairs | $pairs |"
            echo "| Blocked pairs | $blocked |"
            echo "| Unblocked pairs | $unblocked |"
            echo "| Release ready | $ready |"
            echo "| Structural blockers | $structural |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release blocker reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-blockers-${{ github.run_id }}
          path: |
            build/release-blockers.json
            build/release-blockers.md
          if-no-files-found: error
          retention-days: 30

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart --require-approved

      - name: Upload content source audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-source-audit
          path: build/reports/content_source_audit.md
          if-no-files-found: error

      - name: Validate content review workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          dart run tool/content_review.dart export \
            --output build/reports/content_review.csv
          dart run tool/content_review.dart import \
            --input build/reports/content_review.csv
          dart run tool/content_review.dart progress \
            | tee build/reports/content_review_progress.txt
          dart run tool/content_review.dart risk \
            --output build/reports/content_review_risks.csv

      - name: Upload content review artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-review-artifacts
          path: |
            build/reports/content_review.csv
            build/reports/content_review_progress.txt
            build/reports/content_review_risks.csv
          if-no-files-found: error

      - name: Validate release metadata
        run: dart run tool/validate_release_metadata.dart

      - name: Check whitespace
        id: whitespace
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="${head}^"
            fi
          else
            head="${{ github.sha }}"
            base="${head}^"
          fi
          git diff --check "$base...$head" 2>&1 | tee build/reports/whitespace.log

      - name: Upload whitespace diagnostics
        if: steps.whitespace.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whitespace-diagnostics
          path: build/reports/whitespace.log
          if-no-files-found: error

      - name: Fail on whitespace errors
        if: steps.whitespace.outcome == 'failure'
        run: exit 1

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          flutter analyze 2>&1 | tee build/reports/flutter_analyze.log

      - name: Upload analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-analyze-diagnostics
          path: build/reports/flutter_analyze.log
          if-no-files-found: error

      - name: Fail on analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          flutter test 2>&1 | tee build/reports/flutter_test.log

      - name: Upload test diagnostics
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-test-diagnostics
          path: build/reports/flutter_test.log
          if-no-files-found: error

      - name: Fail on test errors
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Install Linux integration test toolchain
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev \
            xvfb

      - name: Run Linux integration flow tests
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          flutter config --enable-linux-desktop
          xvfb-run -a flutter test integration_test/app_flow_test.dart -d linux -r expanded \
            2>&1 | tee build/reports/flutter_integration_test.log

      - name: Upload integration test diagnostics
        if: steps.integration.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-integration-test-diagnostics
          path: build/reports/flutter_integration_test.log
          if-no-files-found: error

      - name: Fail on integration test errors
        if: steps.integration.outcome == 'failure'
        run: exit 1

      - name: Build web
        run: flutter build web --no-web-resources-cdn

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Validate debug APK uses test AdMob App ID
        run: tool/validate_ad_manifest.sh build/app/outputs/flutter-apk/app-debug.apk test

      - name: Create ephemeral Android release signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore android/app/ci-release-key.jks \
            -storepass android \
            -keypass android \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, OU=CI, O=hee-no-tane, L=Tokyo, ST=Tokyo, C=JP"
          cat > android/app/keystore.properties <<'EOF'
          storeFile=ci-release-key.jks
          storePassword=android
          keyAlias=ci-release
          keyPassword=android
          EOF

      - name: Build Android release AAB
        run: flutter build appbundle --release

      - name: Validate release AAB uses production AdMob App ID
        run: tool/validate_ad_manifest.sh build/app/outputs/bundle/release/app-release.aab production

      - name: Remove ephemeral Android release signing
        if: always()
        shell: bash
        run: |
          rm -f android/app/ci-release-key.jks android/app/keystore.properties

  release-readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Generate release blocker report
        run: dart run tool/generate_release_blockers.dart

      - name: Upload release blocker reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-blockers-final-${{ github.run_id }}
          path: |
            build/release-blockers.json
            build/release-blockers.md
          if-no-files-found: error
          retention-days: 90

      - name: Validate final release readiness
        shell: bash
        run: |
          set -o pipefail
          dart run tool/validate_release_readiness.dart --require-final-images \
            | tee build/release-readiness.json

      - name: Upload release readiness result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-readiness-${{ github.run_id }}
          path: build/release-readiness.json
          if-no-files-found: error
          retention-days: 90
