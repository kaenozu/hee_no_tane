name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          set +e
          flutter test --concurrency=1 --reporter expanded > /tmp/flutter-test.log 2>&1
          status=$?
          echo "$status" > /tmp/flutter-test-status.txt
          exit "$status"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: |
            /tmp/flutter-test.log
            /tmp/flutter-test-status.txt
          if-no-files-found: error

      - name: Build web
        run: flutter build web --no-web-resources-cdn
