name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test collection regressions
        run: flutter test test/features/card_collection_stale_data_test.dart --reporter expanded

      - name: Test daily question regressions
        run: flutter test test/features/daily_question_screen_test.dart --reporter expanded

      - name: Test fake repository
        run: flutter test test/helpers/fake_save_repository_test.dart --reporter expanded

      - name: Test app widgets
        run: flutter test test/widget_test.dart --reporter expanded

      - name: Build web
        run: flutter build web --no-web-resources-cdn
