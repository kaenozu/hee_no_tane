name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-review-cleanup:
    if: github.event.pull_request.head.ref == 'agent/serialize-save-updates-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/serialize-save-updates-clean
          fetch-depth: 0

      - name: Replace nested ternary and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/question/daily_question_screen.dart')
          text = path.read_text()
          old = """      final message = e is SaveException
          ? e.message
          : e is SaveLoadException
          ? e.message
          : '回答の保存に失敗しました。もう一度お試しください。';
"""
          new = """      final String message;
      if (e is SaveException) {
        message = e.message;
      } else if (e is SaveLoadException) {
        message = e.message;
      } else {
        message = '回答の保存に失敗しました。もう一度お試しください。';
      }
"""
          if old not in text:
              raise SystemExit('Expected nested ternary block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-pr13-review.yml
          git fetch origin master
          git checkout origin/master -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace nested save error ternary"
          git push origin HEAD:agent/serialize-save-updates-clean
