name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-analyze:
    if: github.event.pull_request.head.ref == 'agent/serialize-save-updates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/serialize-save-updates
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix exception message narrowing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/question/daily_question_screen.dart')
          text = path.read_text()
          old = """      setState(() {\n        _saving = false;\n        _saveSucceeded = false;\n        _saveError = switch (e) {\n          SaveException() => e.message,\n          SaveLoadException() => e.message,\n          _ => '回答の保存に失敗しました。もう一度お試しください。',\n        };\n      });\n"""
          new = """      final message = e is SaveException\n          ? e.message\n          : e is SaveLoadException\n          ? e.message\n          : '回答の保存に失敗しました。もう一度お試しください。';\n      setState(() {\n        _saving = false;\n        _saveSucceeded = false;\n        _saveError = message;\n      });\n"""
          if old not in text:
              raise SystemExit('Expected switch block not found')
          path.write_text(text.replace(old, new, 1))
          PY

          dart format lib/features/question/daily_question_screen.dart
          git fetch origin agent/fix-card-list-stale-save-data
          git checkout origin/agent/fix-card-list-stale-save-data -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/question/daily_question_screen.dart .github/workflows/flutter-ci.yml
          git diff --cached --check
          git commit -m "Fix save error message narrowing"
          git push origin HEAD:agent/serialize-save-updates
