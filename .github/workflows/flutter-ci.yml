name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/fix-card-list-stale-save-data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-card-list-stale-save-data
          fetch-depth: 0

      - name: Remove compatibility APIs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- lib/app.dart .github/workflows/flutter-ci.yml
          rm -f lib/core/save_dependencies.dart
          cat > /tmp/issue9-cleanup.patch <<'PATCH'
