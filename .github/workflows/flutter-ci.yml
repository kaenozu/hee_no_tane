name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate-content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate content bundle
        run: dart run tool/generate_content_bundle.dart

      - name: Commit generated content
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/content_bundle.json assets/data/content_manifest.json
          git commit -m "chore: regenerate approved content bundle"
          git push origin HEAD:${{ github.head_ref }}
