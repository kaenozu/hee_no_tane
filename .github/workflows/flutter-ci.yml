name: Flutter CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        id: test
        shell: bash
        run: |
          set +e
          flutter test > /tmp/flutter-test.log 2>&1
          status=$?
          cat /tmp/flutter-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report test failure
        if: steps.test.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Onboarding CI test failure'
            echo
            echo '```text'
            tail -n 180 /tmp/flutter-test.log
            echo '```'
          } > /tmp/test-failure.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-failure.md
          exit 1

      - name: Build web
        if: steps.test.outputs.status == '0'
        run: flutter build web --no-web-resources-cdn
