name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-card-list-stale-save-data
          fetch-depth: 0

      - name: Apply API cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- lib/app.dart .github/workflows/flutter-ci.yml
          rm -f lib/core/save_dependencies.dart

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # CardList: require explicit dependencies and remove stale SaveData API.
          path = Path('lib/features/collection/card_list_screen.dart')
          text = path.read_text()
          text = text.replace('///   - ../../core/save_dependencies.dart\n', '')
          text = text.replace("import 'package:hee_no_tane_app/core/save_dependencies.dart';\n", '')
          text = text.replace('final SaveRepository? saveRepository;', 'final SaveRepository saveRepository;')
          text = text.replace('final RewardService? rewardService;', 'final RewardService rewardService;')
          replace_old = '''  const CardListScreen({
    super.key,
    required this.allCards,
    this.saveRepository,
    this.rewardService,
    SaveData? saveData,
  });'''
          replace_new = '''  const CardListScreen({
    super.key,
    required this.allCards,
    required this.saveRepository,
    required this.rewardService,
  });'''
          if replace_old not in text:
              raise SystemExit('CardList constructor block not found')
          text = text.replace(replace_old, replace_new, 1)
          text = text.replace('  bool _dependenciesResolved = false;\n', '')
          text = text.replace('  late SaveRepository _saveRepository;\n', '')
          text = text.replace('  late RewardService _rewardService;\n', '')
          pattern = re.compile(r'''  @override\n  void didChangeDependencies\(\) \{.*?\n  \}\n\n  Future<void> _load''', re.S)
          replacement = '''  @override
  void initState() {
    super.initState();
    _load(initial: true);
  }

  Future<void> _load'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'CardList dependency method replacement count={count}')
          text = text.replace('_saveRepository.loadOrThrow()', 'widget.saveRepository.loadOrThrow()')
          text = text.replace('rewardService: _rewardService,', 'rewardService: widget.rewardService,')
          text = text.replace('saveRepository: _saveRepository,', 'saveRepository: widget.saveRepository,')
          path.write_text(text)

          # Home: explicitly inject CardList dependencies and remove obsolete CardDetail snapshot.
          replace_once(
              'lib/features/home/home_screen.dart',
              '''                    builder: (_) => CardListScreen(
                      saveData: _saveData,
                      allCards: widget.allCards,
                    ),''',
              '''                    builder: (_) => CardListScreen(
                      allCards: widget.allCards,
                      saveRepository: widget.saveRepository,
                      rewardService: widget.rewardService,
                    ),''',
          )
          replace_once(
              'lib/features/home/home_screen.dart',
              '''          saveRepository: widget.saveRepository,
          saveData: _saveData,
        ),''',
              '''          saveRepository: widget.saveRepository,
        ),''',
          )

          # CardDetail: remove unused snapshot API.
          path = Path('lib/features/collection/card_detail_screen.dart')
          text = path.read_text()
          text = text.replace("import 'package:hee_no_tane_app/domain/models/save_data.dart';\n", '')
          text = text.replace('    required this.saveRepository,\n    SaveData? saveData,\n', '    required this.saveRepository,\n')
          path.write_text(text)

          # DailyQuestion CardDetail navigation no longer passes stale snapshot.
          replace_once(
              'lib/features/question/daily_question_screen.dart',
              '''        saveRepository: widget.saveRepository,
        saveData: _pendingSaveData ?? widget.saveData,
      ),''',
              '''        saveRepository: widget.saveRepository,
      ),''',
          )

          # Existing tests: remove obsolete CardDetail arguments/imports.
          path = Path('test/features/daily_question_screen_test.dart')
          text = path.read_text()
          text = text.replace('            saveData: SaveData(ownedCardIds: [ownedCard.id]),\n', '')
          path.write_text(text)

          path = Path('test/features/card_detail_screen_test.dart')
          text = path.read_text()
          text = text.replace("import 'package:hee_no_tane_app/domain/models/save_data.dart';\n", '')
          text = re.sub(r'^\s*saveData: SaveData\([^\n]*\),\n', '', text, flags=re.M)
          path.write_text(text)

          # New tests: remove deliberate stale constructor inputs now that APIs are gone.
          path = Path('test/features/card_collection_stale_data_test.dart')
          text = path.read_text()
          text = text.replace('  SaveData? staleData,\n', '')
          text = text.replace('      saveData: staleData,\n', '')
          text = text.replace('''      final stale = SaveData(
        totalBrowseCount: 1,
        streakDays: 1,
        ownedCardIds: [cardA.id],
      );

''', '')
          text = text.replace('          staleData: stale,\n', '')
          text = text.replace('          staleData: SaveData(),\n', '')
          text = text.replace(
              "B4. app-level dependencies open CardList without new repos",
              "B4. Home injects the app repository into CardList",
          )
          path.write_text(text)
          PY

          rm -f .github/workflows/issue9-api-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove stale SaveData APIs and use explicit dependencies"
          git push origin HEAD:agent/fix-card-list-stale-save-data
