name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply_food_correction:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/content-triage-and-correction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-triage-and-correction
          fetch-depth: 0

      - name: Verify reviewed starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "091deb2d40cd5cac549656d785ea2228f877f5ac"
          test -f tool/agent_apply_food_002.py
          test -f .github/workflows/agent_apply_food_002.yml

      - name: Apply correction and validate generated files
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/agent_apply_food_002.py
          python3 -m json.tool assets/data/questions.json >/dev/null
          python3 -m json.tool assets/data/cards.json >/dev/null
          git diff --check

      - name: Restore CI and publish the reviewed change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          git rm .github/workflows/agent_apply_food_002.yml tool/agent_apply_food_002.py
          git add .github/workflows/flutter-ci.yml \
            assets/data/questions.json assets/data/cards.json \
            review/content_corrections_batch_1.csv \
            review/content_research_q_food_002.md \
            docs/17_コンテンツトリアージ運用.md
          git commit -m "Replace unsupported apple production claims"
          git push origin HEAD:agent/content-triage-and-correction

  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'agent/content-triage-and-correction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart

      - name: Upload content source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-source-audit
          path: build/reports/content_source_audit.md
          if-no-files-found: error

      - name: Validate content review workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          dart run tool/content_review.dart export \
            --output build/reports/content_review.csv
          dart run tool/content_review.dart import \
            --input build/reports/content_review.csv
          dart run tool/content_review.dart progress \
            | tee build/reports/content_review_progress.txt
          dart run tool/content_review.dart risk \
            --output build/reports/content_review_risks.csv

      - name: Upload content review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-review-artifacts
          path: |
            build/reports/content_review.csv
            build/reports/content_review_progress.txt
            build/reports/content_review_risks.csv
          if-no-files-found: error

      - name: Validate release metadata
        run: dart run tool/validate_release_metadata.dart

      - name: Check whitespace
        id: whitespace
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="${head}^"
            fi
          fi
          git diff --check "$base...$head" 2>&1 | tee build/reports/whitespace.log

      - name: Upload whitespace diagnostics
        if: steps.whitespace.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: whitespace-diagnostics
          path: build/reports/whitespace.log
          if-no-files-found: error

      - name: Fail on whitespace errors
        if: steps.whitespace.outcome == 'failure'
        run: exit 1

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          flutter analyze 2>&1 | tee build/reports/flutter_analyze.log

      - name: Upload analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-diagnostics
          path: build/reports/flutter_analyze.log
          if-no-files-found: error

      - name: Fail on analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          flutter test 2>&1 | tee build/reports/flutter_test.log

      - name: Upload test diagnostics
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics
          path: build/reports/flutter_test.log
          if-no-files-found: error

      - name: Fail on test errors
        if: steps.test.outcome == 'failure'
        run: exit 1

      - name: Build web
        run: flutter build web --no-web-resources-cdn

      - name: Build Android debug APK
        run: flutter build apk --debug
