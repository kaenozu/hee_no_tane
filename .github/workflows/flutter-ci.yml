name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/fix-card-list-stale-save-data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-card-list-stale-save-data
          fetch-depth: 0

      - name: Remove compatibility APIs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- lib/app.dart .github/workflows/flutter-ci.yml
          rm -f lib/core/save_dependencies.dart
          cat .github/issue9/patch.part* > /tmp/issue9-cleanup.patch
          patch -p1 < /tmp/issue9-cleanup.patch
          rm -rf .github/issue9
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove stale SaveData compatibility APIs"
          git push origin HEAD:agent/fix-card-list-stale-save-data
