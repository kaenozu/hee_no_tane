name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-content-validation:
    if: github.event.pull_request.head.ref == 'feature/content-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/content-validation
          fetch-depth: 2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/content_validation/content_validator_test.dart')
          text = path.read_text()
          replacements = {
              "'q' * 101": "List.filled(101, 'q').join()",
              "'e' * 241": "List.filled(241, 'e').join()",
              "'s' * 121": "List.filled(121, 's').join()",
              "'t' * 61": "List.filled(61, 't').join()",
              "'s' * 141": "List.filled(141, 's').join()",
              "'d' * 501": "List.filled(501, 'd').join()",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected test expression not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          dart format \
            lib/content_validation/content_validator.dart \
            tool/validate_content.dart \
            test/content_validation/content_validator_test.dart

          git show HEAD^:.github/workflows/flutter-ci.yml > .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format content validation implementation"
          git push origin HEAD:feature/content-validation
