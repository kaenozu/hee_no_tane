name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze > analyze-output.txt 2>&1
          status=$?
          cat analyze-output.txt
          exit "$status"

      - name: Upload analyze diagnostics
        if: failure() && steps.analyze.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-output
          path: analyze-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --no-web-resources-cdn

      - name: Verify public policy pages
        shell: bash
        run: |
          test -f build/web/privacy.html
          test -f build/web/support.html

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios-smoke:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
