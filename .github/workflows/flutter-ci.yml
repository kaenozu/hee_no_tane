name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        shell: bash
        run: |
          set +e
          flutter test --concurrency=1 --reporter expanded > /tmp/flutter-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 /tmp/flutter-test.log
          else
            tail -n 30 /tmp/flutter-test.log
          fi
          exit "$status"

      - name: Build web
        run: flutter build web --no-web-resources-cdn
