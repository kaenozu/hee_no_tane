name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-tests:
    if: github.event.pull_request.head.ref == 'agent/serialize-save-updates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/serialize-save-updates
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore helper semantics and migrate real constructors
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/fix-card-list-stale-save-data
          git show origin/agent/fix-card-list-stale-save-data:test/features/daily_question_screen_test.dart > test/features/daily_question_screen_test.dart

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('test/features/daily_question_screen_test.dart')
          text = path.read_text()

          old = """}) {\n  return MaterialApp(\n    home: DailyQuestionScreen(\n"""
          new = """}) {\n  if (saveRepository is FakeSaveRepository && saveData != null) {\n    saveRepository.setLoadedData(saveData);\n  }\n  return MaterialApp(\n    home: DailyQuestionScreen(\n"""
          if old not in text:
              raise SystemExit('buildDailyQuestionScreen helper block not found')
          text = text.replace(old, new, 1)

          old = """}) async {\n  await tester.pumpWidget(\n    MaterialApp(\n"""
          new = """}) async {\n  if (saveRepository is FakeSaveRepository && saveData != null) {\n    saveRepository.setLoadedData(saveData);\n  }\n  await tester.pumpWidget(\n    MaterialApp(\n"""
          if old not in text:
              raise SystemExit('pushDailyQuestionScreen helper block not found')
          text = text.replace(old, new, 1)

          lines = text.splitlines(keepends=True)
          output = []
          in_constructor = False
          depth = 0
          constructor_pattern = re.compile(r'\bDailyQuestionScreen\($')

          for line in lines:
              stripped = line.strip()
              if not in_constructor and constructor_pattern.search(stripped):
                  in_constructor = True
                  depth = line.count('(') - line.count(')')
                  output.append(line)
                  continue

              if in_constructor:
                  if stripped.startswith('saveData:'):
                      depth += line.count('(') - line.count(')')
                      if depth <= 0:
                          in_constructor = False
                      continue
                  depth += line.count('(') - line.count(')')
                  output.append(line)
                  if depth <= 0:
                      in_constructor = False
                  continue

              output.append(line)

          path.write_text(''.join(output))
          PY

          rm -f .github/issue11-final-analyze.txt
          dart format test/features/daily_question_screen_test.dart
          git checkout origin/agent/fix-card-list-stale-save-data -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore DailyQuestion test data injection"
          git push origin HEAD:agent/serialize-save-updates
