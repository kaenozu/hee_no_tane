name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart

      - name: Upload content source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-source-audit
          path: build/reports/content_source_audit.md
          if-no-files-found: error

      - name: Validate release metadata
        run: dart run tool/validate_release_metadata.dart

      - name: Check whitespace
        run: git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --no-web-resources-cdn

      - name: Build Android debug APK
        run: flutter build apk --debug
