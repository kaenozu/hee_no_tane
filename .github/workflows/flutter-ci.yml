name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  remove-stale-api:
    if: github.event.pull_request.head.ref == 'agent/serialize-save-updates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/serialize-save-updates
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove stale constructor argument and format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('lib/features/question/daily_question_screen.dart')
          text = screen.read_text()
          for old in [
              "import 'package:hee_no_tane_app/domain/models/save_data.dart';\n",
              '/// [saveData] 現在のセーブデータ。\n',
              '  final SaveData saveData;\n',
              '    required this.saveData,\n',
          ]:
              if old not in text:
                  raise SystemExit(f'Expected DailyQuestionScreen API fragment not found: {old!r}')
              text = text.replace(old, '', 1)
          screen.write_text(text)

          def remove_invocation_argument(path: Path) -> None:
              lines = path.read_text().splitlines(keepends=True)
              output = []
              in_call = False
              depth = 0
              for line in lines:
                  if not in_call and 'DailyQuestionScreen(' in line and 'const DailyQuestionScreen({' not in line:
                      in_call = True
                      depth = line.count('(') - line.count(')')
                      output.append(line)
                      continue

                  if in_call:
                      if line.lstrip().startswith('saveData:'):
                          depth += line.count('(') - line.count(')')
                          if depth <= 0:
                              in_call = False
                          continue
                      depth += line.count('(') - line.count(')')
                      output.append(line)
                      if depth <= 0:
                          in_call = False
                      continue

                  output.append(line)
              path.write_text(''.join(output))

          for root in (Path('lib'), Path('test')):
              for path in root.rglob('*.dart'):
                  if path != screen:
                      remove_invocation_argument(path)
          PY

          dart format lib test
          git fetch origin agent/fix-card-list-stale-save-data
          git checkout origin/agent/fix-card-list-stale-save-data -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove stale DailyQuestion SaveData input"
          git push origin HEAD:agent/serialize-save-updates
