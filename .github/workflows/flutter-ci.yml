name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-disposal-test:
    if: github.event.pull_request.head.ref == 'feature/card-share-image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/card-share-image
          fetch-depth: 0

      - name: Dispose the entire test tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/features/card_share_test.dart')
          text = path.read_text()
          old = '    await tester.pumpWidget(const MaterialApp(home: SizedBox.shrink()));\n'
          new = '    await tester.pumpWidget(const SizedBox.shrink());\n'
          if old not in text:
              raise SystemExit('Expected disposal pumpWidget line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/card-share-test-output.txt
          git fetch origin master
          git checkout origin/master -- .github/workflows/flutter-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix card share disposal test setup"
          git push origin HEAD:feature/card-share-image
