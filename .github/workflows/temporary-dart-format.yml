name: Temporary Dart Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format and remove temporary workflow
        run: |
          dart format \
            lib/domain/price_comparison \
            lib/features/comparison \
            lib/features/settings/settings_screen.dart \
            test/domain/price_comparison \
            test/features/comparison
          git rm .github/workflows/temporary-dart-format.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format price comparison files"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
