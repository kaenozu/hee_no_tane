name: Repair Integration Test

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Repair integration helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('integration_test/app_flow_test.dart')
          text = path.read_text()
          if 'final displayedQuestions = questions.where' in text:
              print('Integration helper already repaired.')
              raise SystemExit(0)

          pattern = re.compile(
              r'(_answerToday\(\n\s*tester,\n)'
              r'\s*dailyQuestionService: dailyQuestionService,\n'
              r'(\s*questions: questions,\n)'
              r'\s*cards: cards,\n'
          )
          text, count = pattern.subn(r'\1\2', text)
          if count != 5:
              raise SystemExit(f'Expected 5 _answerToday call sites, found {count}.')

          marker = 'Future<Question> _answerToday('
          head, separator, _ = text.partition(marker)
          if not separator:
              raise SystemExit('Could not find _answerToday helper.')

          helper = '''Future<Question> _answerToday(
            WidgetTester tester, {
            required List<Question> questions,
          }) async {
            await tester.tap(find.text('今日の1問を始める'));
            await tester.pumpAndSettle();

            final displayedQuestions = questions
                .where(
                  (question) =>
                      find.text(question.question).evaluate().isNotEmpty,
                )
                .toList(growable: false);
            expect(displayedQuestions, hasLength(1));
            final question = displayedQuestions.single;

            final answerChoice = find.byKey(
              ValueKey<String>('answer-choice-${question.answerIndex}'),
            );
            expect(answerChoice, findsOneWidget);

            await tester.ensureVisible(answerChoice);
            await tester.tap(answerChoice);
            await tester.pumpAndSettle();

            expect(find.text('解説'), findsOneWidget);
            expect(find.text(question.explanation), findsOneWidget);
            expect(find.text('新しい知識カードを発見'), findsOneWidget);

            return question;
          }
          '''
          path.write_text(head + helper)
          PY
          dart format integration_test/app_flow_test.dart

      - name: Commit and push
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integration_test/app_flow_test.dart
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix integration test to follow pinned assignment'
          git push origin "HEAD:$HEAD_BRANCH"
