name: Apply Daily Progress Refactor

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - feature/daily-progress-service

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/daily-progress-service
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Apply refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new, 1))

          screen = 'lib/features/question/daily_question_screen.dart'
          replace_once(
              screen,
              "import 'package:flutter/material.dart';\nimport 'package:hee_no_tane_app/core/date_utils.dart';",
              "import 'package:flutter/material.dart';\nimport 'package:hee_no_tane_app/application/daily_progress_service.dart';\nimport 'package:hee_no_tane_app/core/date_utils.dart';",
          )
          replace_once(
              screen,
              '''  final SaveRepository saveRepository;\n  final RewardService rewardService;\n  final QuestionDateProvider dateProvider;''',
              '''  final SaveRepository saveRepository;\n  final RewardService rewardService;\n  final DailyProgressService? dailyProgressService;\n  final QuestionDateProvider dateProvider;''',
          )
          replace_once(
              screen,
              '''    required this.saveRepository,\n    required this.rewardService,\n    this.dateProvider = _systemDateProvider,''',
              '''    required this.saveRepository,\n    required this.rewardService,\n    this.dailyProgressService,\n    this.dateProvider = _systemDateProvider,''',
          )
          replace_once(
              screen,
              '''class _DailyQuestionScreenState extends State<DailyQuestionScreen> {\n  int? _selectedAnswerIndex;''',
              '''class _DailyQuestionScreenState extends State<DailyQuestionScreen> {\n  DailyProgressService get _dailyProgressService =>\n      widget.dailyProgressService ??\n      DailyProgressService(\n        saveRepository: widget.saveRepository,\n        rewardService: widget.rewardService,\n      );\n\n  int? _selectedAnswerIndex;''',
          )
          replace_once(
              screen,
              '''    final cardId = widget.relatedCard?.id ?? widget.question.relatedCardId;\n\n    try {\n      await widget.saveRepository.update((current) {\n        if (current.lastDailyQuestionDate == date) {\n          final exactMatch = current.hasDailyCompletion(\n            date: date,\n            questionId: widget.question.id,\n            cardId: cardId,\n          );\n          final legacyMatch =\n              current.lastDailyQuestionId.isEmpty &&\n              current.lastDailyCardId.isEmpty &&\n              current.ownedCardIds.contains(cardId);\n          if (exactMatch || legacyMatch) {\n            _cardWasOwnedBeforeAnswer ??= true;\n            return legacyMatch\n                ? current.copyWith(\n                    lastDailyQuestionId: widget.question.id,\n                    lastDailyCardId: cardId,\n                  )\n                : current;\n          }\n          throw const SaveException(\n            '同じ日付に別の問題の回答履歴があります。ホームへ戻って最新の問題を開いてください。',\n          );\n        }\n\n        final card = widget.relatedCard;\n        _cardWasOwnedBeforeAnswer ??=\n            card == null || current.ownedCardIds.contains(card.id);\n\n        var updated = widget.rewardService.recordDailyAnswer(current, date);\n        updated = updated.copyWith(\n          lastDailyQuestionDate: date,\n          lastDailyQuestionId: widget.question.id,\n          lastDailyCardId: cardId,\n        );\n        if (card != null && !current.ownedCardIds.contains(card.id)) {\n          updated = widget.rewardService.applyReward(updated, card);\n        }\n        return updated;\n      });\n\n      if (!mounted) return;\n      setState(() {\n        _saving = false;\n        _saveSucceeded = true;\n        _saveError = null;\n      });''',
              '''    try {\n      final result = await _dailyProgressService.submitAnswer(\n        date: date,\n        question: widget.question,\n        card: widget.relatedCard,\n      );\n\n      if (!mounted) return;\n      setState(() {\n        _cardWasOwnedBeforeAnswer = result.cardWasOwnedBeforeAnswer;\n        _saving = false;\n        _saveSucceeded = true;\n        _saveError = null;\n      });''',
          )

          home = 'lib/features/home/home_screen.dart'
          replace_once(
              home,
              "import 'package:flutter/material.dart';\nimport 'package:hee_no_tane_app/content_validation/content_release_policy.dart';",
              "import 'package:flutter/material.dart';\nimport 'package:hee_no_tane_app/application/daily_progress_service.dart';\nimport 'package:hee_no_tane_app/content_validation/content_release_policy.dart';",
          )
          replace_once(
              home,
              '''class _HomeScreenState extends State<HomeScreen> {\n  SaveData _saveData = SaveData();''',
              '''class _HomeScreenState extends State<HomeScreen> {\n  late final DailyProgressService _dailyProgressService;\n  SaveData _saveData = SaveData();''',
          )
          replace_once(
              home,
              '''  void initState() {\n    super.initState();\n    _lifecycleListener = AppLifecycleListener(onResume: _handleResume);''',
              '''  void initState() {\n    super.initState();\n    _dailyProgressService = DailyProgressService(\n      saveRepository: widget.saveRepository,\n      rewardService: widget.rewardService,\n    );\n    _lifecycleListener = AppLifecycleListener(onResume: _handleResume);''',
          )
          replace_once(
              home,
              '''          relatedCard: _todayCard,\n          saveRepository: widget.saveRepository,''',
              '''          relatedCard: _todayCard,\n          dailyProgressService: _dailyProgressService,\n          saveRepository: widget.saveRepository,''',
          )

          service = 'lib/application/daily_progress_service.dart'
          replace_once(
              service,
              '''    final cardId = card?.id ?? question.relatedCardId;\n    _requireAssignmentValues(date, question.id, cardId);''',
              '''    final cardId = card?.id ?? question.relatedCardId;\n    _requireAnswerValues(date, question.id);''',
          )
          replace_once(
              service,
              '''      var assigned = current;\n      if (!current.hasDailyAssignment(\n        date: date,\n        questionId: question.id,\n        cardId: cardId,\n      )) {\n        assigned = current.copyWith(\n          dailyAssignmentDate: date,\n          dailyAssignmentQuestionId: question.id,\n          dailyAssignmentCardId: cardId,\n        );\n      }''',
              '''      var assigned = current;\n      if (cardId.isNotEmpty &&\n          !current.hasDailyAssignment(\n            date: date,\n            questionId: question.id,\n            cardId: cardId,\n          )) {\n        assigned = current.copyWith(\n          dailyAssignmentDate: date,\n          dailyAssignmentQuestionId: question.id,\n          dailyAssignmentCardId: cardId,\n        );\n      }''',
          )
          replace_once(
              service,
              '''  static void _requireAssignmentValues(\n    String date,''',
              '''  static void _requireAnswerValues(String date, String questionId) {\n    if (date.trim().isEmpty || questionId.trim().isEmpty) {\n      throw ArgumentError('Daily answer date and question id are required.');\n    }\n  }\n\n  static void _requireAssignmentValues(\n    String date,''',
          )

          Path('test/features/daily_question_progress_service_test.dart').write_text(r'''import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:hee_no_tane_app/application/daily_progress_service.dart';
          import 'package:hee_no_tane_app/data/repositories/save_repository.dart';
          import 'package:hee_no_tane_app/domain/models/hee_card.dart';
          import 'package:hee_no_tane_app/domain/models/question.dart';
          import 'package:hee_no_tane_app/domain/models/save_data.dart';
          import 'package:hee_no_tane_app/domain/services/reward_service.dart';
          import 'package:hee_no_tane_app/features/question/daily_question_screen.dart';

          import '../helpers/fake_save_repository.dart';
          import '../helpers/release_content.dart';

          class _RecordingDailyProgressService extends DailyProgressService {
            int calls = 0;
            int failuresRemaining;
            String? submittedDate;
            Question? submittedQuestion;
            HeeCard? submittedCard;

            _RecordingDailyProgressService({
              required super.saveRepository,
              required super.rewardService,
              this.failuresRemaining = 0,
            });

            @override
            Future<DailyAnswerResult> submitAnswer({
              required String date,
              required Question question,
              HeeCard? card,
            }) async {
              calls += 1;
              submittedDate = date;
              submittedQuestion = question;
              submittedCard = card;
              if (failuresRemaining > 0) {
                failuresRemaining -= 1;
                throw const SaveException('simulated failure');
              }
              return DailyAnswerResult(
                saveData: SaveData(
                  lastDailyQuestionDate: date,
                  lastDailyQuestionId: question.id,
                  lastDailyCardId: card?.id ?? question.relatedCardId,
                ),
                cardWasOwnedBeforeAnswer: false,
                alreadyCompleted: false,
              );
            }
          }

          Widget _buildScreen({
            required Question question,
            required HeeCard card,
            required FakeSaveRepository repository,
            required RewardService rewardService,
            required DailyProgressService dailyProgressService,
            String questionDate = '2026-07-17',
            DateTime Function()? dateProvider,
          }) => MaterialApp(
            home: DailyQuestionScreen(
              question: question,
              questionDate: questionDate,
              relatedCard: card,
              saveRepository: repository,
              rewardService: rewardService,
              dailyProgressService: dailyProgressService,
              dateProvider: dateProvider ?? () => DateTime(2026, 7, 17),
            ),
          );

          void main() {
            testWidgets('answer delegates persistence to DailyProgressService', (
              tester,
            ) async {
              final pair = releaseContentPair(id: 'delegation');
              final repository = FakeSaveRepository();
              final rewardService = RewardService();
              final service = _RecordingDailyProgressService(
                saveRepository: repository,
                rewardService: rewardService,
              );

              await tester.pumpWidget(
                _buildScreen(
                  question: pair.question,
                  card: pair.card,
                  repository: repository,
                  rewardService: rewardService,
                  dailyProgressService: service,
                ),
              );
              await tester.pumpAndSettle();

              await tester.tap(find.byKey(const ValueKey('answer-choice-0')));
              await tester.pumpAndSettle();

              expect(service.calls, 1);
              expect(service.submittedDate, '2026-07-17');
              expect(service.submittedQuestion, same(pair.question));
              expect(service.submittedCard, same(pair.card));
              expect(repository.saveCallCount, 0);
              expect(find.text('新しい知識カードを発見'), findsOneWidget);
            });

            testWidgets('retry delegates to the same service without re-answering', (
              tester,
            ) async {
              final pair = releaseContentPair(id: 'retry');
              final repository = FakeSaveRepository();
              final rewardService = RewardService();
              final service = _RecordingDailyProgressService(
                saveRepository: repository,
                rewardService: rewardService,
                failuresRemaining: 1,
              );

              await tester.pumpWidget(
                _buildScreen(
                  question: pair.question,
                  card: pair.card,
                  repository: repository,
                  rewardService: rewardService,
                  dailyProgressService: service,
                ),
              );
              await tester.pumpAndSettle();

              await tester.tap(find.byKey(const ValueKey('answer-choice-0')));
              await tester.pumpAndSettle();

              expect(service.calls, 1);
              expect(find.text('保存エラー'), findsOneWidget);

              await tester.tap(find.text('再試行'));
              await tester.pumpAndSettle();

              expect(service.calls, 2);
              expect(find.text('新しい知識カードを発見'), findsOneWidget);
            });

            testWidgets('date change rejects answer before calling service', (
              tester,
            ) async {
              final pair = releaseContentPair(id: 'date-change');
              final repository = FakeSaveRepository();
              final rewardService = RewardService();
              final service = _RecordingDailyProgressService(
                saveRepository: repository,
                rewardService: rewardService,
              );

              await tester.pumpWidget(
                _buildScreen(
                  question: pair.question,
                  card: pair.card,
                  repository: repository,
                  rewardService: rewardService,
                  dailyProgressService: service,
                  questionDate: '2026-07-16',
                ),
              );
              await tester.pumpAndSettle();

              await tester.tap(find.byKey(const ValueKey('answer-choice-0')));
              await tester.pumpAndSettle();

              expect(service.calls, 0);
              expect(find.textContaining('日付が変わりました'), findsOneWidget);
            });
          }
          ''')
          PY

      - name: Format
        run: dart format lib/features/question/daily_question_screen.dart lib/features/home/home_screen.dart lib/application/daily_progress_service.dart test/features/daily_question_progress_service_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: >-
          flutter test
          test/application/daily_progress_service_test.dart
          test/features/daily_question_screen_test.dart
          test/features/daily_question_recovery_test.dart
          test/features/daily_question_progress_service_test.dart

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/apply-daily-progress-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/question/daily_question_screen.dart \
            lib/features/home/home_screen.dart \
            lib/application/daily_progress_service.dart \
            test/features/daily_question_progress_service_test.dart \
            .github/workflows/apply-daily-progress-refactor.yml
          git commit -m "Use DailyProgressService for daily answers"
          git push origin HEAD:feature/daily-progress-service
