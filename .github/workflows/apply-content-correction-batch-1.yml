name: Apply content correction batch 1

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/content-triage-and-correction
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply source-backed correction
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          question_path = Path('assets/data/questions.json')
          card_path = Path('assets/data/cards.json')

          questions = json.loads(question_path.read_text(encoding='utf-8'))
          cards = json.loads(card_path.read_text(encoding='utf-8'))

          question = next((item for item in questions if item['id'] == 'q_language_001'), None)
          card = next((item for item in cards if item['id'] == 'card_language_001'), None)
          if question is None or card is None:
              raise SystemExit('Correction target is missing')
          if question.get('source', {}).get('reviewStatus') == 'approved':
              raise SystemExit('Question target is already approved')
          if card.get('source', {}).get('reviewStatus') == 'approved':
              raise SystemExit('Card target is already approved')

          question['question'] = 'フランス語の「sabotage（サボタージュ）」と語源的につながる履物「sabot」は何？'
          question['explanation'] = '「sabotage」はフランス語の動詞saboterから派生し、saboterは木靴を表すsabotに由来する。CNRTLには、木靴で音を立てることや、仕事を速く粗雑に行うことなどの古い用法が記録されている。'
          question['sourceNote'] = 'CNRTL「SABOTER」の語義・語源'

          card['title'] = 'サボタージュと木靴'
          card['shortText'] = '語源のsabotは木靴'
          card['detailText'] = 'フランス語saboterには、木靴で音を立てることや、仕事を速く粗雑に行うことなどの古い用法が記録されている。sabotageはこの動詞から派生した語。'
          card['sourceNote'] = 'CNRTL「SABOTER」の語義・語源'

          source = {
              'title': 'SABOTER : Définition de SABOTER',
              'publisher': 'Centre National de Ressources Textuelles et Lexicales (CNRTL)',
              'url': 'https://www.cnrtl.fr/definition/saboter',
              'verifiedAt': '2026-07-13',
              'verificationLevel': 'secondary',
              'reviewStatus': 'approved',
          }
          question['source'] = dict(source)
          card['source'] = dict(source)

          question_path.write_text(
              json.dumps(questions, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          card_path.write_text(
              json.dumps(cards, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Audit content sources
        run: dart run tool/audit_content_sources.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/data/questions.json \
            assets/data/cards.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Correct sabotage etymology content"
          git push origin HEAD:agent/content-triage-and-correction
