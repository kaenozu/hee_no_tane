name: Generate approved content bundle

on:
  pull_request:
    branches:
      - agent/fix-full-source-review

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate approved content bundle
        run: dart run tool/generate_content_bundle.dart

      - name: Upload generated content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-content-bundle-${{ github.run_id }}
          path: |
            assets/data/content_bundle.json
            assets/data/content_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/content_bundle.json assets/data/content_manifest.json
          if git diff --cached --quiet; then
            echo "Generated content is already current."
          else
            git commit -m "Generate approved runtime content bundle"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
