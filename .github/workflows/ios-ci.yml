name: iOS Compile CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ios-release-compile:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Compile unsigned iOS release
        run: flutter build ios --release --no-codesign
