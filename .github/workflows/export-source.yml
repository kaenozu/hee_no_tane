name: Export Source

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Package source
        run: tar --exclude=.git -czf /tmp/hee-no-tane-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ github.sha }}
          path: /tmp/hee-no-tane-source.tar.gz
          if-no-files-found: error
          retention-days: 1
