name: Generate Semantic Integrity Artifact

on:
  push:
    branches:
      - agent/approved-content-semantic-integrity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/approved-content-semantic-integrity

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply semantic corrections and regenerate approvals
        run: dart run tool/apply_semantic_integrity_fixes.dart

      - name: Format changed Dart files
        run: >-
          dart format
          lib/content_validation/semantic_review_gate.dart
          tool/validate_semantic_reviews.dart
          test/content_validation/semantic_review_gate_test.dart
          test/content_validation/approved_content_semantic_regression_test.dart

      - name: Check generated bundle
        run: dart run tool/generate_content_bundle.dart --check

      - name: Validate semantic review ledger
        run: dart run tool/validate_semantic_reviews.dart

      - name: Validate runtime content boundary
        run: dart run tool/validate_runtime_content.dart

      - name: Validate editable content
        run: dart run tool/validate_content.dart

      - name: Audit approved sources
        run: dart run tool/audit_content_sources.dart --require-approved

      - name: Analyze
        run: flutter analyze

      - name: Run semantic and bundle tests
        run: >-
          flutter test
          test/content_validation/content_bundle_builder_test.dart
          test/content_validation/semantic_review_gate_test.dart
          test/content_validation/approved_content_semantic_regression_test.dart
          test/application/daily_progress_service_test.dart

      - name: Upload validated generated files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semantic-integrity-generated-files
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/data/questions.json
            assets/data/cards.json
            assets/data/content_bundle.json
            assets/data/content_manifest.json
            review/approved_semantic_reviews.json
            lib/content_validation/semantic_review_gate.dart
            tool/validate_semantic_reviews.dart
            test/content_validation/semantic_review_gate_test.dart
            test/content_validation/approved_content_semantic_regression_test.dart
