name: Patch duplicate threshold

on:
  push:
    branches:
      - agent/fix-full-source-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/fix-full-source-review

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Patch duplicate similarity boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/content_review/content_risk_classifier.dart')
          source = path.read_text(encoding='utf-8')
          old = '''    return (questionSimilarity >= 0.50 && evidenceSimilarity >= 0.25) ||
                  (questionSimilarity >= 0.40 && evidenceSimilarity >= 0.38);'''
          new = '''    return (questionSimilarity >= 0.50 && evidenceSimilarity >= 0.25) ||
                  (questionSimilarity >= 0.40 && evidenceSimilarity >= 0.38) ||
                  (questionSimilarity >= 0.30 && evidenceSimilarity >= 0.36);'''
          if old not in source:
              raise SystemExit('Expected duplicate similarity expression was not found.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Format patched sources
        run: dart format lib test

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'Fix duplicate fact similarity regression'
          git push origin HEAD:agent/fix-full-source-review
