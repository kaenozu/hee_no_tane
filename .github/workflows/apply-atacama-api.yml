name: Apply Atacama correction through Git data API

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/apply-atacama-api.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/content-triage-and-correction'
    runs-on: ubuntu-latest
    steps:
      - name: Create guarded content commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'agent/content-triage-and-correction';
            const expectedHead = context.payload.pull_request.head.sha;

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const headSha = ref.data.object.sha;
            if (headSha !== expectedHead) {
              core.setFailed(`branch moved: expected ${expectedHead}, found ${headSha}`);
              return;
            }

            const headCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: headSha,
            });

            async function readText(path) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: branch,
              });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`${path} is not a file`);
              }
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            const questionsPath = 'assets/data/questions.json';
            const cardsPath = 'assets/data/cards.json';
            const correctionsPath = 'review/content_corrections_batch_1.csv';

            const questions = JSON.parse(await readText(questionsPath));
            const cards = JSON.parse(await readText(cardsPath));
            const correctionsText = await readText(correctionsPath);

            const question = questions.find((item) => item.id === 'q_geo_004');
            const card = cards.find((item) => item.id === 'card_geo_004');
            if (!question || !card) {
              throw new Error('Atacama question/card pair not found');
            }

            const expectedQuestion = {
              question: '地球上でいちばん乾燥した場所は？',
              choices: ['サハラ砂漠', 'アタカマ砂漠', 'ゴビ砂漠', 'モハーベ砂漠'],
              answerIndex: 1,
              explanation: 'チリのアタカマ砂漠は、過去400年以上雨が降っていない記録がある地域もある、世界で最も乾燥した場所なんだ。',
              relatedCardId: 'card_geo_004',
            };
            for (const [key, value] of Object.entries(expectedQuestion)) {
              if (JSON.stringify(question[key]) !== JSON.stringify(value)) {
                throw new Error(`q_geo_004 changed unexpectedly at ${key}`);
              }
            }

            const expectedCard = {
              title: 'アタカマ砂漠',
              shortText: '世界で最も乾燥した場所。',
              detailText: 'チリのアタカマ砂漠は、400年以上雨が降っていない地域がある世界一乾燥した砂漠。火星に似た環境としても有名。',
            };
            for (const [key, value] of Object.entries(expectedCard)) {
              if (card[key] !== value) {
                throw new Error(`card_geo_004 changed unexpectedly at ${key}`);
              }
            }

            if (correctionsText.includes('q_geo_004,card_geo_004,')) {
              throw new Error('q_geo_004 correction row already exists');
            }

            const source = {
              title: 'A microbial oasis in the hypersaline Atacama subsurface discovered by a life detector chip: implications for the search for life on Mars',
              publisher: 'Astrobiology (Mary Ann Liebert, Inc.)',
              url: 'https://pubmed.ncbi.nlm.nih.gov/22149750/',
              verifiedAt: '2026-07-13',
              verificationLevel: 'primary',
              reviewStatus: 'approved',
            };

            Object.assign(question, {
              question: '2009年、火星を想定した掘削調査で生命検出チップが試験された砂漠は？',
              answerIndex: 1,
              explanation: '研究チームはチリのアタカマ砂漠で火星を想定した掘削調査を行い、生命検出チップを現地で試験した。この技術は、火星で生命を探すための惑星探査技術として評価された。',
              sourceNote: 'Parroほか（2011）Astrobiology',
              verified: true,
              source,
            });

            Object.assign(card, {
              title: '火星探査とアタカマ砂漠',
              shortText: '火星の生命探査技術が試験された。',
              detailText: '2009年、研究チームはチリのアタカマ砂漠で火星を想定した掘削調査を行い、生命検出チップを現地で試験した。検出技術は、火星で生命を探すための惑星探査技術として評価された。',
              sourceNote: 'Parroほか（2011）Astrobiology',
              source,
            });

            const questionsText = `${JSON.stringify(questions, null, 2)}\n`;
            const cardsText = `${JSON.stringify(cards, null, 2)}\n`;
            const csvEscape = (value) => {
              const text = String(value);
              return /[",\n\r]/.test(text)
                ? `"${text.replaceAll('"', '""')}"`
                : text;
            };
            const correctionRow = [
              'q_geo_004',
              'card_geo_004',
              'question,explanation,card',
              'ranking,numeric,historical-claim',
              '乾燥度の世界一と400年以上無降水の一般化を削除し、2009年にアタカマ砂漠で実施された火星類似掘削調査と生命検出チップの現地試験へ差し替え',
              source.title,
              source.publisher,
              source.url,
              source.verifiedAt,
              source.verificationLevel,
              source.reviewStatus,
            ].map(csvEscape).join(',');
            const normalizedCorrections = correctionsText.endsWith('\n')
              ? correctionsText
              : `${correctionsText}\n`;
            const updatedCorrections = `${normalizedCorrections}${correctionRow}\n`;

            if (
              question.source.url !== card.source.url ||
              question.source.reviewStatus !== 'approved' ||
              question.source.verificationLevel !== 'primary' ||
              question.explanation.includes('400年') ||
              card.detailText.includes('400年') ||
              `${question.question}${question.explanation}${card.shortText}${card.detailText}`.includes('世界で最も乾燥')
            ) {
              throw new Error('post-update Atacama assertions failed');
            }

            async function createBlob(content) {
              const response = await github.rest.git.createBlob({
                owner,
                repo,
                content,
                encoding: 'utf-8',
              });
              return response.data.sha;
            }

            const [questionsBlob, cardsBlob, correctionsBlob] = await Promise.all([
              createBlob(questionsText),
              createBlob(cardsText),
              createBlob(updatedCorrections),
            ]);

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: headCommit.data.tree.sha,
              tree: [
                { path: questionsPath, mode: '100644', type: 'blob', sha: questionsBlob },
                { path: cardsPath, mode: '100644', type: 'blob', sha: cardsBlob },
                { path: correctionsPath, mode: '100644', type: 'blob', sha: correctionsBlob },
                { path: '.github/workflows/apply-atacama-content.yml', mode: '100644', type: 'blob', sha: null },
                { path: '.github/workflows/apply-atacama-pr.yml', mode: '100644', type: 'blob', sha: null },
                { path: '.github/workflows/apply-atacama-api.yml', mode: '100644', type: 'blob', sha: null },
              ],
            });

            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'content: replace unsupported Atacama ranking claim',
              tree: tree.data.sha,
              parents: [headSha],
            });

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false,
            });

            core.info(`created ${commit.data.sha}`);
