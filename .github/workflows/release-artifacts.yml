name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Store build number / version code
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate content
        run: dart run tool/validate_content.dart

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done

      - name: Prepare signing files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/app/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release --build-number "${{ inputs.build_number }}"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: hee-no-tane-android-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/app/keystore.properties

  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release --no-web-resources-cdn --build-number "${{ inputs.build_number }}"

      - name: Verify public policy pages
        shell: bash
        run: |
          test -f build/web/privacy.html
          test -f build/web/support.html

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: hee-no-tane-web-${{ inputs.build_number }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
