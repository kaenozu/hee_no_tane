name: Rebuild v2 branch on master

on:
  push:
    branches:
      - agent/v2-clean

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/v2-clean
          fetch-depth: 0

      - name: Copy PR 46 files from source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/content-bundle-daily-assignment
          git checkout origin/agent/content-bundle-daily-assignment -- \
            .github/workflows/content-ci.yml \
            assets/data/content_bundle.json \
            assets/data/content_manifest.json \
            lib/app.dart \
            lib/application/daily_progress_service.dart \
            lib/content_validation/content_bundle_builder.dart \
            lib/data/repositories/content_bundle_repository.dart \
            lib/data/repositories/save_repository.dart \
            lib/domain/models/content_bundle.dart \
            lib/domain/models/save_data.dart \
            lib/features/home/daily_assignment_gate.dart \
            lib/main.dart \
            pubspec.yaml \
            test/application/daily_progress_service_test.dart \
            test/content_validation/content_bundle_builder_test.dart \
            tool/generate_content_bundle.dart \
            tool/validate_runtime_content.dart
          git rm .github/workflows/rebuild-v2-clean.yml

      - name: Commit rebuilt branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild content bundle changes on master"
          git push origin HEAD:agent/v2-clean
